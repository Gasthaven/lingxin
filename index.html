      b.style.width = local.size===sv?'30px':'24px';
      b.style.height = local.size===sv?'30px':'24px';
      b.style.border = `2px solid ${local.size===sv?C.brown:C.border}`;
      b.style.background = local.size===sv?C.brownL:C.card;
    });
    colorDots.forEach((dot,i)=>{
      const col=['#B07B3A','#E8A5A5','#A8C890','#88B8D0','#C4A8D8','#F0C870','#888888','#2C2C2C','#fff'][i];
      dot.style.border = (local.color===col&&local.tool==='pen')?`3px solid ${C.brown}`:`2px solid ${C.border}`;
      dot.style.transform = (local.color===col&&local.tool==='pen')?'scale(1.2)':'scale(1)';
    });
  }

  // ── Toolbar ──
  const tb = card({padding:'10px 14px',marginBottom:'8px',display:'flex',alignItems:'center',gap:'10px',flexWrap:'wrap'});
  const toolRow = h('div',{style:{display:'flex',gap:'6px'}});
  [{id:'pen',l:'🖊️ 画笔'},{id:'eraser',l:'🩹 橡皮'}].forEach(t=>{
    const b = btn(t.l,{padding:'6px 12px',borderRadius:'8px',border:`1.5px solid ${local.tool===t.id?C.brown:C.border}`,background:local.tool===t.id?C.brownL:'#fff',fontSize:'12px',fontWeight:'600',color:C.txt},()=>{
      local.tool=t.id; refreshToolUI();
    });
    toolRow.appendChild(b);
  });
  tb.appendChild(toolRow);
  tb.appendChild(h('div',{style:{width:'1px',height:'24px',background:C.border}}));
  const sizeRow = h('div',{style:{display:'flex',gap:'6px',alignItems:'center'}});
  [{v:3,l:'细'},{v:6,l:'中'},{v:12,l:'粗'},{v:20,l:'宽'}].forEach(s=>{
    const sb = btn(s.l,{width:local.size===s.v?'30px':'24px',height:local.size===s.v?'30px':'24px',borderRadius:'50%',border:`2px solid ${local.size===s.v?C.brown:C.border}`,background:local.size===s.v?C.brownL:'#fff',fontSize:'10px',fontWeight:'600',color:C.txt,transition:'all .15s'},()=>{
      local.size=s.v; refreshToolUI();
    });
    sizeRow.appendChild(sb);
  });
  tb.appendChild(sizeRow);
  tb.appendChild(btn('清空',{marginLeft:'auto',padding:'6px 14px',borderRadius:'8px',border:`1px solid ${C.border}`,background:C.card,fontSize:'12px',color:C.sub,fontWeight:'600'},()=>{
    const cv=document.getElementById('doodle-canvas');
    if(cv) cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
  }));
  body.appendChild(tb);

  // ── Colors ──
  const colorRow = card({padding:'10px 14px',marginBottom:'8px',display:'flex',gap:'8px',alignItems:'center',flexWrap:'wrap'});
  colorRow.appendChild(h('span',{style:{fontSize:'12px',color:C.sub,fontWeight:'600',marginRight:'4px'}},'颜色'));
  const colorDots = [];
  ['#B07B3A','#E8A5A5','#A8C890','#88B8D0','#C4A8D8','#F0C870','#888888','#2C2C2C','#fff'].forEach((col,idx)=>{
    const dot = h('div',{style:{width:'28px',height:'28px',borderRadius:'50%',background:col,cursor:'pointer',border:local.color===col&&local.tool==='pen'?`3px solid ${C.brown}`:`2px solid ${C.border}`,boxSizing:'border-box',transition:'transform .15s',transform:local.color===col&&local.tool==='pen'?'scale(1.2)':'scale(1)'}});
    dot.onclick=()=>{ local.color=col; local.tool='pen'; refreshToolUI(); };
    colorDots.push(dot);
    colorRow.appendChild(dot);
  });
  body.appendChild(colorRow);

  // ── Canvas ──
  const canvasWrap = h('div',{class:'canvas-wrap',style:{position:'relative'}});
  const cvs = h('canvas',{id:'doodle-canvas',width:'880',height:'560',style:{width:'100%',height:'auto',display:'block',cursor:'none',touchAction:'none'}});
  canvasWrap.appendChild(cvs);
  // 笔刷光标指示器：跟随鼠标显示当前画笔大小与颜色，解决浅色背景上看不清光标的问题
  const cursorDot = h('div',{style:{position:'absolute',left:'0',top:'0',borderRadius:'50%',pointerEvents:'none',border:'2px solid #B07B3A',transform:'translate(-50%,-50%)',display:'none',zIndex:'10',boxSizing:'border-box',transition:'width .12s,height .12s,border-color .12s,background .12s'}});
  canvasWrap.appendChild(cursorDot);
  body.appendChild(canvasWrap);
  body.appendChild(h('p',{style:{textAlign:'center',fontSize:'12px',color:C.sub,marginTop:'8px'}},'情绪没有对错，随心所欲地画吧 🌈'));
  wrap.appendChild(body);

  // ── Canvas 事件（用 local 变量，不触发 setState）──
  setTimeout(()=>{
    const c = document.getElementById('doodle-canvas');
    if(!c) return;
    let drawing=false, lastPos=null;
    const getPos=(e)=>{
      const r=c.getBoundingClientRect();
      const src=e.touches?e.touches[0]:e;
      return{x:(src.clientX-r.left)*(c.width/r.width),y:(src.clientY-r.top)*(c.height/r.height)};
    };
    // 更新笔刷光标指示器：根据当前工具/颜色/大小显示圆圈，让用户始终知道画笔位置
    const updateCursor=(e)=>{
      const r=c.getBoundingClientRect();
      const src=e.touches?e.touches[0]:e;
      const dispX=src.clientX-r.left;
      const dispY=src.clientY-r.top;
      const scale=r.width/c.width;
      const brushSize=(local.tool==='eraser'?local.size*4:local.size)*scale;
      cursorDot.style.display='block';
      cursorDot.style.left=dispX+'px';
      cursorDot.style.top=dispY+'px';
      cursorDot.style.width=Math.max(brushSize,10)+'px';
      cursorDot.style.height=Math.max(brushSize,10)+'px';
      if(local.tool==='eraser'){
        cursorDot.style.border='2px dashed #666';
        cursorDot.style.background='rgba(100,100,100,0.1)';
      }else{
        cursorDot.style.border='2px solid '+local.color;
        cursorDot.style.background=local.color+'33';
      }
    };
    const startDraw=(e)=>{
      e.preventDefault(); drawing=true;
      const pos=getPos(e); lastPos=pos;
      const ctx=c.getContext('2d');
      ctx.globalCompositeOperation=local.tool==='eraser'?'destination-out':'source-over';
      ctx.beginPath();
      ctx.arc(pos.x,pos.y,local.tool==='eraser'?local.size*2:local.size/2,0,Math.PI*2);
      ctx.fillStyle=local.tool==='eraser'?'rgba(0,0,0,1)':local.color; ctx.fill();
    };
    const draw=(e)=>{
      e.preventDefault(); if(!drawing||!lastPos) return;
      const ctx=c.getContext('2d'); const pos=getPos(e);
      ctx.globalCompositeOperation=local.tool==='eraser'?'destination-out':'source-over';
      ctx.beginPath(); ctx.moveTo(lastPos.x,lastPos.y); ctx.lineTo(pos.x,pos.y);
      ctx.strokeStyle=local.tool==='eraser'?'rgba(0,0,0,1)':local.color;
      ctx.lineWidth=local.tool==='eraser'?local.size*4:local.size;
      ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke();
      lastPos=pos;
    };
    const stopDraw=()=>{drawing=false;lastPos=null;};
    c.addEventListener('mousedown',startDraw);
    c.addEventListener('mousemove',(e)=>{updateCursor(e);draw(e);});
    c.addEventListener('mouseup',stopDraw);
    c.addEventListener('mouseenter',updateCursor);
    c.addEventListener('mouseleave',()=>{cursorDot.style.display='none';stopDraw();});
    c.addEventListener('touchstart',startDraw,{passive:false});
    c.addEventListener('touchmove',draw,{passive:false});
    c.addEventListener('touchend',stopDraw);
  },50);
  return wrap;
}

function trackAction(type) {
  const ach = loadAchievements();
  ach.points = (ach.points||0) + 1;
  ach.events = ach.events || [];
  const now = new Date();
  ach.events.push({type, date: now.toISOString().slice(0,10), hour: now.getHours()});

  // 解锁判定
  ach.badges = ach.badges || [];
  const quizCount = ach.events.filter(e=>e.type==='quiz').length;
  const moodDays = new Set(ach.events.filter(e=>e.type==='mood').map(e=>e.date)).size;
  const hasNight = ach.events.some(e=>e.type==='chat' && (e.hour>=22||e.hour<6));
  const knowledgeCount = ach.events.filter(e=>e.type==='knowledge').length;
  const breatheCount = ach.events.filter(e=>e.type==='breathe').length;
  const chatCount = ach.events.filter(e=>e.type==='chat').length;

  const checks = {quiz3: quizCount>=3, mood7: moodDays>=7, nightowl: hasNight, knowledge5: knowledgeCount>=5, breathe10: breatheCount>=10, chat20: chatCount>=20};
  Object.entries(checks).forEach(([id, ok]) => { if (ok && !ach.badges.includes(id)) { ach.badges.push(id); notifyBadge(id); } });

  // 连续心情记录奖励
  ach.moodStreak = ach.moodStreak || 0;
  const today = now.toISOString().slice(0,10);
  const yesterday = new Date(now-86400000).toISOString().slice(0,10);
  const lastMood = ach.events.filter(e=>e.type==='mood').map(e=>e.date).sort().pop();
  if (lastMood === today) {
    if (!ach._lastStreakDate || ach._lastStreakDate === yesterday) { ach.moodStreak++; }
    else if (ach._lastStreakDate !== today) { ach.moodStreak = 1; }
    ach._lastStreakDate = today;
  }

  saveAchievements(ach);
}

function getTreeStage() {
  const pts = loadAchievements().points || 0;
  let stage = TREE_STAGES[0];
  for (const s of TREE_STAGES) { if (pts >= s.min) stage = s; }
  return {pts, ...stage};
}
function renderMood() {
  const {moodSel, moodNote, moodSaved, moodDiaries, activeRelax} = state;
  if(activeRelax==='breath') return renderBreathing();
  if(activeRelax==='meditate') return renderMeditation();
  if(activeRelax==='gratitude') return renderGratitude();
  if(activeRelax==='doodle') return renderDoodle();

  const wrap = h('div',null);
  const inner = h('div',null);
  inner.appendChild(banner('g-rose','MOOD JOURNAL · 心情馆','记录每一刻的你',['日记 · 打卡 · 放松练习'],'⭐'));

  // ── 成长树 ──
  const tree = getTreeStage();
  const ach = loadAchievements();
  const treeCard = card({padding:'18px',marginBottom:'12px',textAlign:'center'});
  treeCard.appendChild(h('div',{style:{fontWeight:'700',fontSize:'15px',color:C.txt,marginBottom:'12px'}},'🌳 我的成长树'));
  treeCard.appendChild(h('div',{style:{fontSize:'64px',marginBottom:'8px',transition:'transform .3s'}},tree.emoji));
  treeCard.appendChild(h('div',{style:{fontWeight:'700',fontSize:'16px',color:C.brown,marginBottom:'4px'}},tree.label));
  treeCard.appendChild(h('div',{style:{fontSize:'12px',color:C.sub,marginBottom:'12px'}},tree.hint));
  const progWrap = h('div',{style:{height:'6px',background:C.border,borderRadius:'3px',overflow:'hidden',maxWidth:'280px',margin:'0 auto 4px'}});
  const nextStage = TREE_STAGES.find(s=>s.min>tree.pts) || {min:tree.pts+1};
  const prevStage = [...TREE_STAGES].reverse().find(s=>s.min<=tree.pts) || TREE_STAGES[0];
  const pct = Math.min(100, ((tree.pts-prevStage.min)/(nextStage.min-prevStage.min))*100);

  treeCard.appendChild(h('div',{style:{fontSize:'10px',color:C.light}},'🌿 关怀值 '+tree.pts+' · 下一阶段还需 '+(nextStage.min-tree.pts)+' 点'));

  const moodRow = h('div',{class:'mood-btns'});

  mc.appendChild(moodRow);
  const ta = h('textarea',{rows:'3',placeholder:'今天发生了什么？有什么想说的…（选填）',style:{width:'100%',padding:'10px 12px',borderRadius:'10px',border:`1.5px solid ${C.border}`,fontSize:'13px',lineHeight:'1.7',outline:'none',background:C.bg,color:C.txt,display:'block',marginBottom:'12px'},value:moodNote});
  ta.oninput=e=>{ state.moodNote=e.target.value; };
  mc.appendChild(ta);
  const todayStr = new Date().toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});
  const todayEntry = state.moodDiaries.find(d=>d.date===todayStr);
  const btnLabel = todayEntry ? '✏️ 修改今天的心情' : '保存今天的心情 🌸';
  mc.appendChild(btn(btnLabel,{width:'100%',padding:'14px',background:moodSel?G_ROSE:C.border,color:'#fff',border:'none',borderRadius:'12px',fontSize:'14px',fontWeight:'700'},()=>{
    if(!state.moodSel) return;

    const timeStr = now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    if (todayEntry) {
      todayEntry.mood = state.moodSel;
      todayEntry.note = state.moodNote.trim();
      todayEntry.time = timeStr;
      localStorage.setItem('lx_d',JSON.stringify(state.moodDiaries));
      setState({moodSaved:true,moodNote:''});
    } else {
      const e={id:Date.now(),mood:state.moodSel,note:state.moodNote.trim(),date:todayStr,time:timeStr};
      const u=[e,...state.moodDiaries].slice(0,60);
      trackAction('mood'); localStorage.setItem('lx_d',JSON.stringify(u));
      setState({moodDiaries:u,moodSaved:true,moodNote:''});
    }
    setTimeout(()=>setState({moodSaved:false}),2000);
  }));
  inner.appendChild(mc);

  // ── 情绪趋势图（真实数据）──────────────────────────────────────
  const wc = card({padding:'18px',marginBottom:'12px'});
  // Tab switcher: bar / line
  const chartState = {mode: 'bar'};
  const tabRow = h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'14px'}});
  tabRow.appendChild(h('div',{style:{fontWeight:'700',fontSize:'14px',color:C.txt}},'📊 情绪趋势图'));
  const tabSwitch = h('div',{style:{display:'flex',gap:'4px',background:C.bg,borderRadius:'8px',padding:'3px'}});
  ['柱状','折线'].forEach((lb,i)=>{
    const tb = h('button',{style:{padding:'3px 10px',borderRadius:'6px',fontSize:'11px',fontWeight:'600',border:'none',background:i===0?C.card:'none',color:i===0?C.brown:C.sub,boxShadow:i===0?'0 1px 4px rgba(0,0,0,.08)':'none',cursor:'pointer'}},lb);
    tb.onclick=()=>{
      chartState.mode = i===0?'bar':'line';
      // re-draw
      drawChart();
      // update tab styles
      tabSwitch.querySelectorAll('button').forEach((b,bi)=>{
        b.style.background = bi===i?C.card:'none';
        b.style.color = bi===i?C.brown:C.sub;
        b.style.boxShadow = bi===i?'0 1px 4px rgba(0,0,0,.08)':'none';
      });
    };
    tabSwitch.appendChild(tb);
  });
  tabRow.appendChild(tabSwitch);
  wc.appendChild(tabRow);

  // Build 7-day data from moodDiaries
  function getLast7Days() {
    const days = [];
    for(let i=6;i>=0;i--) {
      const d = new Date(); d.setDate(d.getDate()-i);
      const label = ['日','一','二','三','四','五','六'][d.getDay()];
      const dateStr = d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});
      const entry = moodDiaries.find(e=>e.date===dateStr);
      days.push({label, dateStr, score: entry?entry.mood.sc:null, emoji: entry?entry.mood.em:null});
    }
    return days;
  }

  const chartCanvas = h('canvas',{id:'trend-canvas',width:'420',height:'140',style:{width:'100%',height:'auto',display:'block'}});
  wc.appendChild(chartCanvas);

  // Legend
  const legend = h('div',{style:{display:'flex',justifyContent:'center',gap:'12px',marginTop:'10px',flexWrap:'wrap'}});
  [{sc:5,em:'🥰',lb:'很好'},{sc:4,em:'😊',lb:'不错'},{sc:3,em:'😐',lb:'一般'},{sc:2,em:'😔',lb:'低落'},{sc:1,em:'🤢',lb:'糟糕'}].forEach(m=>{
    legend.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'4px',fontSize:'11px',color:C.sub}},h('span',null,m.em),m.lb));
  });
  wc.appendChild(legend);

  // Hint if no data
  const hint = h('div',{id:'chart-hint',style:{textAlign:'center',fontSize:'12px',color:C.light,marginTop:'8px',display:'none'}},'记录几天心情后，这里会展示你的情绪变化 🌱');
  wc.appendChild(hint);

  function drawChart() {
    const canvas = document.getElementById('trend-canvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const W=420, H=140, padL=20, padR=10, padT=16, padB=30;
    const cW=W-padL-padR, cH=H-padT-padB;
    ctx.clearRect(0,0,W,H);

    const days = getLast7Days();
    const hasData = days.some(d=>d.score!==null);
    document.getElementById('chart-hint').style.display = hasData?'none':'block';

    const n = days.length;
    const slotW = cW/(n-1);
    const scoreToY = s => padT + cH - ((s-1)/4)*cH;

    // Score colors
    const scoreColor = {5:'#C07878',4:'#D0A860',3:'#D8C060',2:'#C8A860',1:'#A0B060'};

    if(chartState.mode === 'bar') {
      // Draw horizontal grid lines
      [1,2,3,4,5].forEach(s=>{
        const y = scoreToY(s);
        ctx.beginPath(); ctx.strokeStyle=C.border; ctx.lineWidth=1;
        ctx.moveTo(padL,y); ctx.lineTo(padL+cW,y); ctx.stroke();
      });
      // Draw bars
      const barW = Math.min(slotW*0.6, 32);
      days.forEach((d,i)=>{
        const x = padL + i*slotW;
        if(d.score!==null) {
          const barH = ((d.score-1)/4)*cH;
          const y = padT+cH-barH;
          // gradient fill
          const grd = ctx.createLinearGradient(0,y,0,padT+cH);
          grd.addColorStop(0, scoreColor[d.score]);
          grd.addColorStop(1, scoreColor[d.score]+'44');
          ctx.fillStyle = grd;
          ctx.beginPath();
          ctx.roundRect(x-barW/2, y, barW, barH, [4,4,0,0]);
          ctx.fill();
          // emoji on top
          ctx.font='12px serif'; ctx.textAlign='center';
          ctx.fillText(d.emoji, x, y-4);
        }
        // day label
        ctx.fillStyle = C.sub; ctx.font='10px PingFang SC,sans-serif'; ctx.textAlign='center';
        ctx.fillText(d.label, x, H-6);
      });
    } else {
      // Line chart
      // Grid
      [1,2,3,4,5].forEach(s=>{
        const y = scoreToY(s);
        ctx.beginPath(); ctx.strokeStyle=C.border; ctx.lineWidth=1;
        ctx.moveTo(padL,y); ctx.lineTo(padL+cW,y); ctx.stroke();
      });
      // Fill area
      const filled = days.filter(d=>d.score!==null);
      if(filled.length>1) {
        ctx.beginPath();
        let started=false;
        days.forEach((d,i)=>{
          if(d.score===null) return;
          const x=padL+i*slotW, y=scoreToY(d.score);
          if(!started){ctx.moveTo(x,y);started=true;}else{ctx.lineTo(x,y);}
        });
        // close for fill
        const lastFilled=days.reduce((a,d,i)=>d.score?i:a,-1);
        const firstFilled=days.findIndex(d=>d.score);
        ctx.lineTo(padL+lastFilled*slotW,padT+cH);
        ctx.lineTo(padL+firstFilled*slotW,padT+cH);
        ctx.closePath();
        ctx.fillStyle='rgba(176,123,58,0.12)'; ctx.fill();
        // Line
        ctx.beginPath(); started=false;
        days.forEach((d,i)=>{
          if(d.score===null) return;
          const x=padL+i*slotW, y=scoreToY(d.score);
          if(!started){ctx.moveTo(x,y);started=true;}else{ctx.lineTo(x,y);}
        });
        ctx.strokeStyle=C.brown; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();
      }
      // Dots & emojis
      days.forEach((d,i)=>{
        const x=padL+i*slotW;
        if(d.score!==null){
          const y=scoreToY(d.score);
          ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2);
          ctx.fillStyle='#fff'; ctx.fill();
          ctx.strokeStyle=C.brown; ctx.lineWidth=2; ctx.stroke();
          ctx.font='11px serif'; ctx.textAlign='center';
          ctx.fillText(d.emoji,x,y-10);
        }
        ctx.fillStyle=C.sub; ctx.font='10px PingFang SC,sans-serif'; ctx.textAlign='center';
        ctx.fillText(d.label,x,H-6);
      });
    }
  }

  // Draw after mount
  setTimeout(drawChart, 30);
  inner.appendChild(wc);

  // Relax
  inner.appendChild(h('div',{style:{fontWeight:'700',fontSize:'15px',color:C.txt,marginBottom:'10px'}},'🕯️ 放松练习'));
  const relaxGrid = h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'16px'}});
  [{ic:'🫁',title:'呼吸放松',sub:'跟随引导深呼吸',id:'breath'},{ic:'🌌',title:'冥想引导',sub:'平静内心的练习',id:'meditate'},{ic:'🌻',title:'感恩日记',sub:'记录三件好事',id:'gratitude'},{ic:'🎨',title:'涂鸦释放',sub:'用画笔表达情绪',id:'doodle'}].forEach(r=>{
    const rc = card({padding:'16px',textAlign:'center',cursor:'pointer'});
    rc.onclick=()=>setState({activeRelax:r.id});
    rc.appendChild(h('div',{style:{fontSize:'28px',marginBottom:'6px'}},r.ic));
    rc.appendChild(h('div',{style:{fontWeight:'600',fontSize:'13px',color:C.txt}},r.title));
    rc.appendChild(h('div',{style:{fontSize:'11px',color:C.sub,marginTop:'2px'}},r.sub));
    rc.appendChild(h('div',{style:{fontSize:'11px',color:C.brown,marginTop:'6px',fontWeight:'600'}},'点击进入 ›'));
    relaxGrid.appendChild(rc);
  });
  inner.appendChild(relaxGrid);

  // Diaries
  if(moodDiaries.length>0) {
    inner.appendChild(h('div',{style:{fontWeight:'700',fontSize:'15px',color:C.txt,marginBottom:'10px'}},'往期日记'));
    moodDiaries.forEach(d=>{
      const dc = card({padding:'12px 16px',marginBottom:'8px',display:'flex',alignItems:'center',gap:'12px'});
      dc.appendChild(h('span',{style:{fontSize:'22px'}},MOODS.find(m=>m.lb===d.mood?.lb)?.em||'😐'));
      dc.appendChild(h('div',{style:{flex:'1'}},h('div',{style:{fontWeight:'600',fontSize:'13px',color:C.txt}},d.mood?.lb||'已记录'+(d.note?` · ${d.note.slice(0,20)}${d.note.length>20?'…':''}`:'')+'')));
      dc.appendChild(h('div',{style:{fontSize:'11px',color:C.light}},d.date+' '+d.time));
      inner.appendChild(dc);
    });
  }
  wrap.appendChild(inner);
  return wrap;
}

  const p = state.userProfile;

  // Back button when coming from another page
  if (state.returnTo) {
    const backRow = h('div',{style:{marginBottom:'12px'}});

  if (!p) {
    const emptyCard = card({padding:'24px',textAlign:'center'});
    emptyCard.appendChild(h('div',{style:{fontSize:'48px',marginBottom:'12px'}},'📋'));
    emptyCard.appendChild(h('h2',{style:{fontWeight:'700',fontSize:'18px',color:C.txt,marginBottom:'8px'}},'创建你的个人档案'));
    emptyCard.appendChild(h('p',{style:{fontSize:'13px',color:C.sub,marginBottom:'20px',lineHeight:'1.7'}},'完善个人信息后，AI将为你提供更个性化的陪伴和建议。所有数据仅保存在本地，随时可以修改或删除。'));

    let inp;
    if(f.type === 'select' && f.options) {
      // 下拉选择框
      inp = h('select',{style:{width:'100%',padding:'10px 14px',borderRadius:'10px',border:'1.5px solid '+C.border,fontSize:'14px',outline:'none',background:C.bg,color:C.txt,fontFamily:'inherit',cursor:'pointer'}});
      // 添加默认空选项
      const defaultOpt = h('option',{value:''},'请选择');

      f.options.forEach(opt=>{
        const option = h('option',{value:opt},opt);
        if(p[f.key] === opt) option.selected = true;
        inp.appendChild(option);
      });
      inp.onchange = e=>updateProfile({[f.key]:e.target.value});
    } else {
      // 普通输入框
      inp = h('input',{style:{width:'100%',padding:'10px 14px',borderRadius:'10px',border:'1.5px solid '+C.border,fontSize:'14px',outline:'none',background:C.bg,color:C.txt},placeholder:f.placeholder||'',type:f.type||'text',value:p[f.key]||''});

      // 局部 DOM 更新，不触发全局重绘

      state.userProfile = null;
      try{localStorage.removeItem('lx_profile');}catch{}

  wrap.appendChild(formCard);

  // Test history
  if(p.testHistory && p.testHistory.length>0){

      info.appendChild(h('div',{style:{fontSize:'10px',color:C.light,marginTop:'2px'}},t.date));
      tc.appendChild(info);
      wrap.appendChild(tc);
    });
  }

  return wrap;
}

    {ic:'👥',lb:'团队介绍',sub:'我们是一群热爱心理健康事业的大学生开发者，用技术传递温暖'},
    {ic:'📧',lb:'联系方式 · 邮箱',sub:'hual54462@gmail.com'},
    {ic:'📞',lb:'联系方式 · 电话',sub:'19712252959'},
    {ic:'✨',lb:'特别鸣谢',sub:'感谢所有支持我们的用户(*￣3￣)╭💕'},
  ].forEach((it,i,arr)=>{

    row.appendChild(h('span',{style:{fontSize:'18px',flexShrink:'0'}},it.ic));
    const info = h('div',{style:{flex:'1'}});
    info.appendChild(h('div',{style:{fontSize:'14px',color:C.txt,fontWeight:'600'}},it.lb));
    info.appendChild(h('div',{style:{fontSize:'12px',color:C.sub,marginTop:'2px'}},it.sub));
    row.appendChild(info);
    infoCard.appendChild(row);
  });
  inner.appendChild(infoCard);

  // Version info
  const verCard = card({overflow:'hidden',marginBottom:'12px'});
  // 使用指南 —— 单独做成 button 确保可点击
  const guideBtn = h('button',{style:{
    display:'flex',alignItems:'center',gap:'12px',padding:'14px 16px',
    borderBottom:`1px solid ${C.border}`,width:'100%',background:'none',
    border:'none',borderLeft:'none',borderRight:'none',borderTop:'none',
    cursor:'pointer',textAlign:'left',fontFamily:'inherit',
    transition:'background .18s'
  }});
  guideBtn.appendChild(h('span',{style:{fontSize:'18px'}},'📖'));
  guideBtn.appendChild(h('span',{style:{flex:'1',fontSize:'14px',color:C.brown,fontWeight:'600'}},'使用指南'));
  guideBtn.appendChild(h('span',{style:{fontSize:'12px',color:C.sub}},'›'));
  guideBtn.onclick = () => showOnboarding();
  guideBtn.onmouseenter = () => { guideBtn.style.background = C.brownL; };
  guideBtn.onmouseleave = () => { guideBtn.style.background = ''; };
  verCard.appendChild(guideBtn);

  [{ic:'🔒',lb:'数据存储方式',r:'仅本地'},{ic:'📟',lb:'当前版本',r:'最新版'}].forEach((it,i)=>{
    const row = h('div',{style:{display:'flex',alignItems:'center',gap:'12px',padding:'14px 16px',borderBottom:i<1?`1px solid ${C.border}`:'none'}});
    row.appendChild(h('span',{style:{fontSize:'18px'}},it.ic));
    row.appendChild(h('span',{style:{flex:'1',fontSize:'14px',color:C.txt,fontWeight:'500'}},it.lb));
    row.appendChild(h('span',{style:{fontSize:'12px',color:C.sub}},it.r));
    verCard.appendChild(row);
  });
  inner.appendChild(verCard);

  // Hotlines
  const hotCard = card({overflow:'hidden',marginBottom:'12px'});
  [{ic:'🆘',lb:'全国心理援助热线',r:'12356'},{ic:'🧩',lb:'安徽心理危机热线',r:'0551-63666903'}].forEach((it,i)=>{
    const row = h('div',{style:{display:'flex',alignItems:'center',gap:'12px',padding:'14px 16px',borderBottom:i===0?`1px solid ${C.border}`:'none'}});
    row.appendChild(h('span',{style:{fontSize:'18px'}},it.ic));
    row.appendChild(h('span',{style:{flex:'1',fontSize:'14px',color:C.txt,fontWeight:'500'}},it.lb));
    row.appendChild(h('span',{style:{fontSize:'12px',color:C.brown,fontWeight:'600'}},it.r));
    hotCard.appendChild(row);
  });
  inner.appendChild(hotCard);

  const footer = h('div',{style:{textAlign:'center',paddingTop:'8px',color:C.sub,fontSize:'12px',lineHeight:'2'}});
  footer.appendChild(h('div',null,'聆心是AI辅助工具，提供情感陪伴与支持'));
  footer.appendChild(h('div',{style:{fontWeight:'700',color:C.txt}},'不能替代专业心理咨询'));
  footer.appendChild(h('div',null,'如有严重困扰，请及时寻求专业帮助'));

  wrap.appendChild(inner);
  return wrap;
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
const PAGE_META = {
  quiz:     {title:'趣测馆',     sub:'探索真实的你'},
  chat:     {title:'暖心窝',     sub:'AI 陪伴 · 随时倾听'},
  knowledge:{title:'知愈馆',     sub:'知识治愈心灵'},
  mood:     {title:'心情馆',     sub:'记录每一刻的你'},
  about:    {title:'关于我们',   sub:'聆心'},
  profile:  {title:'个人档案',   sub:'你的心理画像'},
};
const NAV_ITEMS = [
  {id:'quiz',ic:'🎭',lb:'趣测馆'},
  {id:'chat',ic:'💬',lb:'暖心窝'},
  {id:'knowledge',ic:'📚',lb:'知愈馆'},
  {id:'mood',ic:'🌸',lb:'心情馆'},
  {id:'about',ic:'🌿',lb:'关于我们'},
];

function navTo(id) {
  breathTimers.forEach(clearTimeout); breathTimers=[];
  setState({page:id,quizActive:null,quizResult:null,kDetail:null,activeRelax:null,returnTo:null});
}

function render() {
  // ── Sidebar nav ──
  const sbNav = document.getElementById('sb-nav');
  if(sbNav) {
    sbNav.innerHTML = '';
    NAV_ITEMS.forEach(it=>{
      const btn2 = document.createElement('button');
      btn2.className = 'nav-item' + (state.page===it.id?' active':'');
      const ni2=document.createElement('span');ni2.className='ni';ni2.textContent=it.ic;
      const nl2=document.createElement('span');nl2.className='nl';nl2.textContent=it.lb;
      btn2.appendChild(ni2);btn2.appendChild(nl2);
      btn2.onclick = ()=>navTo(it.id);
      sbNav.appendChild(btn2);
    });
  }

  // ── Mobile nav ──
  const mNav = document.getElementById('mobile-nav');
  if(mNav) {
    const hideNav = (state.page==='mood'&&state.activeRelax) ||
      (state.page==='quiz'&&(state.quizActive||state.quizResult)) || (state.page==='knowledge'&&state.kDetail);
    mNav.style.display = hideNav ? 'none' : '';
    mNav.innerHTML = '';
    NAV_ITEMS.forEach(it=>{
      const b = document.createElement('button');
      if(state.page===it.id) b.className='active';
      const mi3=document.createElement('span');mi3.className='mi';mi3.textContent=it.ic;mi3.style.filter=state.page===it.id?'none':'grayscale(60%) opacity(.7)';
      const ml3=document.createElement('span');ml3.className='ml';ml3.textContent=it.lb;
      b.appendChild(mi3);b.appendChild(ml3);
      if(state.page===it.id){const dot=document.createElement('div');dot.className='mdot';b.appendChild(dot);}
      b.onclick = ()=>navTo(it.id);
      mNav.appendChild(b);
    });
  }

  // ── Topbar title ──
  const isSubPage = state.quizActive||state.quizResult||state.kDetail||state.activeRelax;
  const meta = PAGE_META[state.page];
  const tbTitle = document.getElementById('tb-title');
  const tbSub = document.getElementById('tb-sub');
  const tbLeft = document.getElementById('tb-left');
  if(tbTitle) tbTitle.textContent = isSubPage ? (
    state.quizActive ? state.quizActive.title+'测试' :
    state.quizResult ? '测试结果' :
    state.kDetail ? state.kDetail.title :
    state.activeRelax==='breath' ? '🫁 呼吸放松' :
    state.activeRelax==='meditate' ? '🌌 冥想引导' :
    state.activeRelax==='gratitude' ? '🌻 感恩日记' :
    state.activeRelax==='doodle' ? '🎨 涂鸦释放' :
    meta.title
  ) : meta.title;
  if(tbSub) tbSub.textContent = isSubPage ? '' : meta.sub;

  // Back button in topbar (left side, before title)
  if(tbLeft) {
    const existBack = tbLeft.querySelector('.back-btn');
    if(existBack) existBack.remove();
    if(isSubPage) {
      const backB = document.createElement('button');
      backB.className = 'back-btn';
      const fromChat = state.returnTo === 'chat';
      backB.textContent = fromChat ? '← 返回对话' : '← 返回';
      backB.title = fromChat ? '回到暖心窝对话' : '返回上一页';
      backB.onclick = ()=>{
        breathTimers.forEach(clearTimeout); breathTimers=[];
        if(state.activeRelax) {
          setState({page:fromChat?'chat':state.page,activeRelax:null,breathPhase:null,breathCycle:0,medStarted:false,medStep:0,returnTo:null});
        } else if(state.kDetail) {
          setState({page:fromChat?'chat':state.page,kDetail:null,returnTo:null});
        } else if(state.quizResult) {
          setState({page:fromChat?'chat':state.page,quizActive:null,quizStep:0,quizAns:{},quizResult:null,returnTo:null});
        } else {
          setState({page:fromChat?'chat':state.page,quizActive:null,quizStep:0,quizAns:{},quizResult:null,returnTo:null});
        }
      };
      tbLeft.insertBefore(backB, tbLeft.firstChild);
    }
  }

  // ── Dark toggle sync ──
  const dtBtn = document.getElementById('dark-toggle-btn');
  const dtLabel = document.getElementById('dark-label');
  if(dtBtn) dtBtn.classList.toggle('on', state.darkMode);
  if(dtLabel) dtLabel.textContent = state.darkMode ? '深色' : '浅色';

  // ── 风格选择器（仅聊天页显示在顶栏）──
  const tbRight = document.getElementById('tb-right');
  if (tbRight) {
    const existStyle = tbRight.querySelector('.style-sel');
    if (existStyle) existStyle.remove();
    if (state.page==='chat') {
      const curStyle = CHAT_STYLES[state.chatStyle] || CHAT_STYLES.gentle;
      const sel = document.createElement('select');
      sel.className = 'style-sel';
      sel.style.cssText = `padding:5px 8px;border-radius:8px;border:1.5px solid ${C.border};background:${C.card};color:${C.txt};font-size:12px;font-weight:600;cursor:pointer;outline:none;font-family:inherit;`;
      Object.entries(CHAT_STYLES).forEach(([k,v])=>{
        const opt = document.createElement('option');
        opt.value = k; opt.textContent = v.icon+' '+v.label;
        if (k===state.chatStyle) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.onchange = ()=>{
        const next = sel.value;
        try { localStorage.setItem('lx_style', next); } catch{}
        const msgs = [...state.chatMsgs];
        if (msgs.length===1 && msgs[0].role==='ai') msgs[0] = {role:'ai', text:CHAT_STYLES[next].greet};
        setState({chatStyle:next, chatMsgs:msgs});
      };
      tbRight.insertBefore(sel, dtBtn);
    }
  }

  // ── Content ──
  const content = document.getElementById('content');
  if(!content) return;

  // 计算当前"场景键"：只有真正切换场景时才播放入场动画，避免同页面状态更新时的闪烁
  const sceneKey = [
    state.page,
    state.quizActive ? (state.quizActive.id||state.quizActive.title) : '',
    state.quizResult ? 'result' : '',
    state.kDetail ? state.kDetail.title : '',
    state.activeRelax || '',
    state.showHistory ? 'hist' : '',
  ].join('|');
  const sceneChanged = (content._sceneKey !== sceneKey);
  content._sceneKey = sceneKey;

  content.innerHTML = '';
  const pages = {quiz:renderQuiz, chat:renderChat, knowledge:renderKnowledge, mood:renderMood, about:renderAbout, profile:renderProfile};
  const pageEl = pages[state.page]();
  // For chat, render directly into content without extra padding
  if(state.page==='chat') {
    content.style.padding = '0';
    content.style.overflow = 'hidden';
    content.style.display = 'flex';
    content.style.flexDirection = 'column';
    // 移动端：聊天区高度减去底部导航栏，防止输入框被遮住
    const isMobile = window.innerWidth <= 900;
    const mNav = document.getElementById('mobile-nav');
    const navVisible = isMobile && mNav && mNav.style.display !== 'none';
    const navH = navVisible ? (mNav.getBoundingClientRect().height || 65) : 0;
    content.style.height = navH > 0 ? `calc(100% - ${navH}px)` : '';
    content.style.maxHeight = navH > 0 ? `calc(100% - ${navH}px)` : '';
  } else {
    content.style.padding = '';
    content.style.overflow = '';
    content.style.display = '';
    content.style.flexDirection = '';
    content.style.height = '';
    content.style.maxHeight = '';
  }
  // 只在场景切换时播放入场动画，同场景内的状态更新不播放，避免闪烁
  if(sceneChanged) pageEl.classList.add('page-enter');
  content.appendChild(pageEl);

  // 聊天页面自动滚动到底部
  if(state.page === 'chat') {
    setTimeout(() => {
      const msgsEl = document.querySelector('.chat-msgs');
      if (msgsEl) msgsEl.scrollTop = msgsEl.scrollHeight;
    }, 100);
  }
  // MBTI modal removed – click goes directly to full version
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
// roundRect polyfill for older browsers
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    const radii=Array.isArray(r)?r:[r,r,r,r];
    const [tl,tr,br,bl]=[radii[0],radii[1]||radii[0],radii[2]||radii[0],radii[3]||radii[1]||radii[0]];
    this.beginPath();
    this.moveTo(x+tl,y);
    this.lineTo(x+w-tr,y); this.quadraticCurveTo(x+w,y,x+w,y+tr);
    this.lineTo(x+w,y+h-br); this.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
    this.lineTo(x+bl,y+h); this.quadraticCurveTo(x,y+h,x,y+h-bl);
    this.lineTo(x,y+tl); this.quadraticCurveTo(x,y,x+tl,y);
    this.closePath();
  };
}
if (state.chatMsgs.length===1 && state.chatMsgs[0].role==='ai' && state.chatMsgs[0].text==='想聊聊吗？') {
  state.chatMsgs[0].text = getGreeting();
}
render();

  // ── 移动端键盘弹起适配 ──
  if (window.visualViewport) {
    let originalHeight = window.innerHeight;
    window.visualViewport.addEventListener('resize', () => {
      const chatShell = document.querySelector('.chat-shell');
      if (chatShell && state.page === 'chat') {
        // 键盘弹起时，调整聊天区域高度
        const keyboardHeight = originalHeight - window.visualViewport.height;
        if (keyboardHeight > 100) {
          // 键盘弹起了
          chatShell.style.height = (window.visualViewport.height - 56) + 'px';
          // 滚动到底部
          setTimeout(() => {
            const msgsEl = document.querySelector('.chat-msgs');
            if (msgsEl) msgsEl.scrollTop = msgsEl.scrollHeight;
          }, 100);
        } else {
          // 键盘收起了，恢复原高度
          chatShell.style.height = '';
        }
      }
    });
  }
</script>
