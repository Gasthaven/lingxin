<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>@font-face{font-family:'LXGW WenKai';src:local('LXGW WenKai'),url(https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.woff2) format('woff2');font-display:swap;}</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聆心 · 大学生情绪陪伴平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ── CSS 自定义属性：统一管理主题色，深色/浅色切换仅需修改变量 ── */
:root{
  --bg:#F5F2EE;
  --bg-outer:#EDE8E1;
  --card:#fff;
  --border:#EDE9E3;
  --border-soft:#F0EDE7;
  --txt:#2C2C2C;
  --sub:#888;
  --light:#bbb;
  --brown:#B07B3A;
  --brown-l:#F0E4CC;
  --brown-hover:#FBF0E4;
  --brown-grad-light:#C8894A;
  --brown-grad-dark:#A06830;
  --green:#3D6B5A;
  --green-l:#D4E8DF;
  --green-grad-light:#4A7A68;
  --green-grad-dark:#2E5A48;
  --rose:#8B5A5A;
  --sidebar-bg:#fff;
  --topbar-bg:#fff;
  --hover-bg:#F7F4F0;
  --input-bg:#F7F4F0;
  --scrollbar:#D5CFC5;
  --shadow:0 2px 12px rgba(0,0,0,.04);
  --shadow-hover:0 6px 24px rgba(0,0,0,.08);
  --opt-hover-border:#D4A870;
  --opt-hover-bg:#FBF5EE;
}
body.dark{
  --bg:#1A1A1E;
  --bg-outer:#1A1A1E;
  --card:#26262C;
  --border:#38383F;
  --border-soft:#38383F;
  --txt:#EFEFEF;
  --sub:#999;
  --light:#555;
  --brown:#C8894A;
  --brown-l:#2E2014;
  --brown-hover:#2E2014;
  --brown-grad-light:#C8894A;
  --brown-grad-dark:#A06830;
  --green:#4A8A70;
  --green-l:#1A2E28;
  --green-grad-light:#4A7A68;
  --green-grad-dark:#2E5A48;
  --rose:#A07070;
  --sidebar-bg:#1E1E24;
  --topbar-bg:#1E1E24;
  --hover-bg:#2A2A32;
  --input-bg:#2C2C34;
  --scrollbar:#38383F;
  --shadow:0 2px 12px rgba(0,0,0,.25);
  --shadow-hover:0 6px 24px rgba(0,0,0,.35);
  --opt-hover-border:#C8894A;
  --opt-hover-bg:#2E2014;
}

body{background:var(--bg-outer);font-family:'LXGW WenKai','PingFang SC','Microsoft YaHei',serif;min-height:100vh}
button{cursor:pointer;font-family:inherit}
input,textarea{font-family:inherit}
textarea{resize:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}

/* ── Shell ── */
#app{display:flex;min-height:100vh}
#sidebar{width:220px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;z-index:200;display:flex;flex-direction:column;box-shadow:2px 0 16px rgba(0,0,0,.04)}
#main{margin-left:220px;flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#topbar{height:60px;background:var(--topbar-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:99;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:28px 32px 40px;background:var(--bg);min-height:0}

/* Sidebar parts */
.sb-logo{padding:24px 20px 18px;border-bottom:1px solid var(--border-soft)}
.sb-logo-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--brown-grad-light),var(--brown-grad-dark));display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;margin-bottom:10px}
.sb-logo h1{font-size:20px;font-weight:800;color:var(--txt)}
.sb-logo p{font-size:10px;color:var(--light);letter-spacing:1px;margin-top:2px}
.sb-nav{flex:1;padding:14px 12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer;transition:all .18s;margin-bottom:3px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--hover-bg)}
.nav-item.active{background:linear-gradient(135deg,var(--brown-hover),var(--brown-l))}
.nav-item .ni{font-size:20px;flex-shrink:0}
.nav-item .nl{font-size:14px;font-weight:600;color:var(--sub)}
.nav-item.active .nl{color:var(--brown)}
.sb-footer{padding:16px 20px;border-top:1px solid var(--border-soft)}
.sb-footer p{font-size:11px;color:var(--light);line-height:1.7}

/* Topbar */
.tb-title{font-size:18px;font-weight:800;color:var(--txt)}
.tb-sub{font-size:11px;color:var(--light);margin-top:1px}
.tb-actions{display:flex;gap:8px;align-items:center}
.tb-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--hover-bg);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:background .15s}
.tb-btn:hover{background:var(--border)}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--brown);font-size:14px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;transition:background .15s}
.back-btn:hover{background:var(--brown-hover)}
.top-hdr{position:fixed;top:0;left:0;right:0;height:56px;background:var(--topbar-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:150;flex-shrink:0}

/* Card */
.card{background:var(--card);border-radius:16px;border:1px solid var(--border);box-shadow:var(--shadow)}

/* Banner */
.banner{border-radius:18px;overflow:hidden;margin-bottom:24px;padding:28px 28px 24px;display:flex;justify-content:space-between;align-items:flex-start;min-height:120px}
.banner h2{margin:0 0 8px;font-size:24px;font-weight:800;color:#fff}
.banner .label{font-size:11px;color:rgba(255,255,255,.6);letter-spacing:1.5px;margin-bottom:8px}
.banner .sub{font-size:13px;color:rgba(255,255,255,.85);line-height:1.7}
.banner .icon{font-size:64px;opacity:.18;user-select:none}
.g-brown{background:linear-gradient(135deg,#C8894A,#A06830)}
.g-green{background:linear-gradient(135deg,#4A7A68,#2E5A48)}
.g-rose{background:linear-gradient(135deg,#A06868,#7A4848)}
.g-purple{background:linear-gradient(135deg,#C8A0C0,#8870A8,#6858A0)}

/* Grids */
.quiz-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.sec-title{font-weight:700;font-size:16px;color:var(--txt);margin:0 0 14px;display:flex;align-items:center;gap:8px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;margin-bottom:8px}

/* Opt buttons */
.opt-btn{padding:14px 18px;border-radius:12px;font-size:14px;text-align:left;border:1.5px solid var(--border);background:var(--card);color:var(--txt);width:100%;margin-bottom:10px;font-weight:500;transition:all .15s;cursor:pointer}
.opt-btn:hover{border-color:var(--opt-hover-border);background:var(--opt-hover-bg)}
.opt-btn.selected{border-color:var(--brown);background:var(--brown-l)}

/* Progress */
.progress{height:5px;background:var(--border);border-radius:3px;margin-bottom:22px;overflow:hidden}
.progress-fill{height:100%;background:var(--brown);border-radius:3px;transition:width .3s}

/* Chat layout */
.chat-shell{display:flex;height:calc(100vh - 60px)}
.chat-left{width:280px;flex-shrink:0;border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;overflow:hidden}
.chat-right{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.chat-tab-bar{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.chat-tab-bar button{flex:1;padding:14px 0;background:none;border:none;font-size:13px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;cursor:pointer;transition:all .2s}
.chat-tab-bar button.active{color:var(--brown);border-bottom-color:var(--brown)}
.chat-panel{flex:1;overflow-y:auto;padding:16px}
.chat-msgs{flex:1;overflow-y:auto;padding:24px 28px 0}
.bubble{max-width:56%;min-width:120px;padding:13px 17px;font-size:14px;line-height:1.8;white-space:normal;word-break:break-word;word-wrap:break-word}
.bubble.ai{border-radius:4px 18px 18px 18px;background:var(--card);color:var(--txt);border:1px solid var(--border);box-shadow:0 1px 6px rgba(0,0,0,.04)}
.bubble.user{border-radius:18px 4px 18px 18px;background:linear-gradient(135deg,var(--brown-grad-light),var(--brown-grad-dark));color:#fff}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;align-self:flex-end}
.mood-tags{padding:10px 28px 0;display:flex;gap:8px;flex-wrap:wrap}
.mood-tag{padding:6px 14px;border-radius:20px;font-size:12px;background:var(--card);border:1px solid var(--border);color:var(--sub);white-space:nowrap;font-weight:500;cursor:pointer;transition:all .15s}
.mood-tag:hover{background:var(--brown-hover);border-color:var(--brown);color:var(--brown)}
.chat-input-row{padding:14px 28px 20px;display:flex;gap:10px;background:var(--card);border-top:1px solid var(--border);flex-shrink:0}
.chat-input{flex:1;padding:13px 18px;border-radius:26px;font-size:14px;border:1.5px solid var(--border);outline:none;background:var(--input-bg);color:var(--txt);transition:border-color .2s}
.chat-input:focus{border-color:var(--brown);background:var(--card)}
.send-btn{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--brown-grad-light),var(--brown-grad-dark));border:none;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Mood */
.mood-btns{display:flex;gap:10px;margin-bottom:16px}
.mood-btn{flex:1;padding:14px 0;border-radius:12px;border:2px solid var(--border);background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .15s}
.mood-btn:hover{transform:translateY(-2px)}

/* Canvas */
.canvas-wrap{border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#FAFAF8;touch-action:none}
canvas{display:block;width:100%;height:auto;touch-action:none}

/* Animations */
@keyframes dot{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.dot-anim{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brown);margin:0 2px;animation:dot 1s infinite}

/* ── iOS-style animations ── */

/* 页面切入 */
@keyframes pageIn{
  from{opacity:0.4;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.page-enter{animation:pageIn .32s cubic-bezier(.25,.46,.45,.94) both}

/* 气泡滑入 - AI */
@keyframes bubbleInLeft{
  from{opacity:0;transform:translateX(-10px) scale(.97)}
  to{opacity:1;transform:translateX(0) scale(1)}
}
/* 气泡滑入 - User */
@keyframes bubbleInRight{
  from{opacity:0;transform:translateX(10px) scale(.97)}
  to{opacity:1;transform:translateX(0) scale(1)}
}
.bubble-in-left{animation:bubbleInLeft .28s cubic-bezier(.25,.46,.45,.94) both}
.bubble-in-right{animation:bubbleInRight .22s cubic-bezier(.25,.46,.45,.94) both}

/* 卡片浮入 */
@keyframes cardIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
.card-enter{animation:cardIn .3s cubic-bezier(.25,.46,.45,.94) both}

/* 按钮点击弹性 */
button:active,.nav-item:active,.mood-tag:active,.opt-btn:active{
  transform:scale(.96);
  transition:transform .1s cubic-bezier(.25,.46,.45,.94)
}
.send-btn:active{transform:scale(.9)!important}

/* 侧边栏 nav 激活动画 */
.nav-item{transition:background .22s cubic-bezier(.25,.46,.45,.94),transform .15s cubic-bezier(.25,.46,.45,.94)}
.nav-item:hover{transform:translateX(3px)}
.nav-item.active{transform:translateX(2px)}

/* 卡片 hover 上浮 */
.card{transition:box-shadow .22s cubic-bezier(.25,.46,.45,.94),transform .22s cubic-bezier(.25,.46,.45,.94)}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.08)}

/* mood-tag 弹性 */
.mood-tag{transition:all .2s cubic-bezier(.25,.46,.45,.94)}
.mood-tag:hover{transform:translateY(-2px) scale(1.04)}

/* opt-btn 选中 */
.opt-btn{transition:all .2s cubic-bezier(.25,.46,.45,.94)}
.opt-btn:hover{transform:translateY(-1px)}

/* 进度条 */
.progress-fill{transition:width .45s cubic-bezier(.25,.46,.45,.94)}

/* chat-tab 下划线滑动 */
.chat-tab-bar button{transition:color .2s cubic-bezier(.25,.46,.45,.94),border-bottom-color .2s cubic-bezier(.25,.46,.45,.94)}

/* 输入框聚焦 */
.chat-input{transition:border-color .25s cubic-bezier(.25,.46,.45,.94),background .25s,box-shadow .25s}
.chat-input:focus{border-color:var(--brown);background:var(--card);box-shadow:0 0 0 3px rgba(176,123,58,.1)}

/* Mobile nav (hidden on PC) */
.mobile-nav{display:none}

/* ── Responsive: mobile ── */
@media(max-width:900px){
  #sidebar{display:none}
  #main{margin-left:0;height:100vh;overflow:hidden}
  /* 非聊天页：内容区留出底部导航栏空间 */
  #content{padding:16px 14px 80px}
  #topbar{padding:0 14px;height:56px}

  /* 测试卡片：小屏 2列，极小屏 1列 */
  .quiz-grid{grid-template-columns:1fr 1fr;gap:10px}

  /* 气泡宽度放宽，移动端更舒适 */
  .bubble{max-width:82%;font-size:14px}

  /* 聊天区布局：高度 = 视口 - 顶栏56px - 底部导航栏~65px */
  .chat-shell{height:calc(100vh - 56px - 65px);display:flex;flex-direction:column}
  .chat-left{display:none}
  .chat-right{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .chat-msgs{flex:1;overflow-y:auto;padding:12px 12px 16px}
  .chat-input-row{padding:10px 12px 14px;gap:8px;flex-shrink:0}
  /* 兜底：输入行底部加安全区，防止被遮住 */
  .chat-input-row{padding-bottom:max(14px, env(safe-area-inset-bottom, 14px))}
  /* 心情标签区域 */
  .mood-tags{padding:6px 12px 0;flex-shrink:0}
  .mood-tags{padding:6px 12px 0;gap:6px}
  .mood-tag{font-size:11px;padding:5px 11px}

  /* Agent 技能卡片：移动端去掉左缩进 */
  .agent-card-wrapper{margin-left:0 !important;margin-right:0}

  /* 底部导航栏 */
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:rgba(255,255,255,.97);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid var(--border);z-index:300;padding:6px 0 env(safe-area-inset-bottom,12px)
  }
  body.dark .mobile-nav{background:rgba(26,26,30,.97)}
  .mobile-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;padding:4px 0;cursor:pointer;transition:transform .15s}
  .mobile-nav button:active{transform:scale(.92)}
  .mobile-nav button .mi{font-size:21px}
  .mobile-nav button .ml{font-size:10px;font-weight:600;color:var(--light);letter-spacing:.2px}
  .mobile-nav button.active .ml{color:var(--brown)}
  .mobile-nav button .mdot{width:18px;height:2px;border-radius:1px;background:var(--brown);margin-top:1px}

  /* 顶栏返回按钮缩小 */
  .back-btn{font-size:13px;padding:4px 10px}
  .tb-title{font-size:16px}

  /* Banner 在移动端压缩 */
  .banner{padding:20px 18px 18px;min-height:100px}
  .banner h2{font-size:20px}
  .banner .icon{font-size:48px}

  /* hscroll（小贴士横滑）在移动端去掉右侧空白 */
  .hscroll{padding-right:14px}

  /* 卡片内间距缩小 */
  .card{border-radius:14px}
}

/* 极小屏（≤400px）：测试卡片单列 */
@media(max-width:400px){
  .quiz-grid{grid-template-columns:1fr}
  .banner h2{font-size:18px}
  .bubble{max-width:88%}
}

/* ── 深色模式：CSS 变量已自动处理，仅需补充特殊覆盖 ── */

/* 通用文字继承 */
body.dark{color:var(--txt)}
body.dark p,body.dark span,body.dark div,body.dark label{color:inherit}

/* placeholder 颜色 */
body.dark .chat-input::placeholder{color:var(--light)}

/* banner / 气泡文字（彩色背景白字，不受变量影响） */
body.dark .banner h2,body.dark .banner .sub,body.dark .banner .label,body.dark .banner .icon{color:inherit}
body.dark .g-brown *,body.dark .g-green *,body.dark .g-rose *,body.dark .g-purple *{color:#fff}
body.dark .bubble.user{color:#fff}

/* 深色模式切换按钮动画 */
.dark-toggle{
  width:44px;height:26px;border-radius:13px;border:none;cursor:pointer;
  position:relative;padding:0;flex-shrink:0;
  background:linear-gradient(135deg,#C8C8D8,#A8A8B8);
  transition:background .35s cubic-bezier(.25,.46,.45,.94);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.2);
}
.dark-toggle.on{background:linear-gradient(135deg,#4A4A6A,#2E2E4E)}
.dark-toggle::after{
  content:'☀️';font-size:13px;line-height:1;
  position:absolute;top:4px;left:4px;
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .2s;
}
.dark-toggle.on::after{content:'🌙';transform:translateX(18px)}

/* ── Onboarding ── */
#onboarding{
  position:fixed;inset:0;z-index:2000;
  background:#F5F2EE;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 28px 40px;
  transition:opacity .4s cubic-bezier(.25,.46,.45,.94);
}
body.dark #onboarding{background:var(--bg)}
#onboarding.hiding{opacity:0;pointer-events:none}

.ob-slides{width:100%;max-width:380px;overflow:hidden;position:relative;flex:1;display:flex;align-items:center}
.ob-track{display:flex;width:100%;transition:transform .42s cubic-bezier(.25,.46,.45,.94)}
.ob-slide{min-width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 8px}

.ob-icon-wrap{
  width:110px;height:110px;border-radius:32px;
  background:linear-gradient(135deg,var(--brown-grad-light),var(--brown-grad-dark));
  display:flex;align-items:center;justify-content:center;
  font-size:52px;margin-bottom:32px;
  box-shadow:0 12px 40px rgba(176,123,58,.3);
  animation:obIconIn .5s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes obIconIn{from{transform:scale(.6) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

.ob-title{font-size:24px;font-weight:900;color:var(--txt);margin-bottom:12px;line-height:1.3}
.ob-desc{font-size:15px;color:var(--sub);line-height:1.8;max-width:300px}

.ob-dots{display:flex;gap:8px;margin:32px 0 24px}
.ob-dot{width:8px;height:8px;border-radius:4px;background:var(--border);transition:all .3s cubic-bezier(.25,.46,.45,.94)}
.ob-dot.active{width:24px;background:var(--brown)}

.ob-btns{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
.ob-next{
  width:100%;padding:16px;border-radius:16px;border:none;
  background:linear-gradient(135deg,var(--brown-grad-light),var(--brown-grad-dark));
  color:#fff;font-size:16px;font-weight:700;cursor:pointer;
  font-family:inherit;
  box-shadow:0 4px 20px rgba(176,123,58,.35);
  transition:transform .15s cubic-bezier(.25,.46,.45,.94),box-shadow .15s;
}
.ob-next:active{transform:scale(.97);box-shadow:0 2px 10px rgba(176,123,58,.25)}
.ob-skip{
  width:100%;padding:12px;border-radius:16px;border:none;
  background:none;color:var(--light);font-size:14px;cursor:pointer;font-family:inherit;
  transition:color .2s;
}
.ob-skip:hover{color:var(--sub)}

/* ── Agent 技能卡片动画 ── */

@keyframes skillGroupIn{
  from{opacity:0;transform:translateY(8px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes badgePop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  50%{transform:translate(-50%,-50%) scale(1.08)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
</style>
</head>
<body>
<div id="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-icon">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">

function saveQuizDraft() {
  const { quizActive, quizStep, quizAns, returnTo } = state;
  if (!quizActive || quizStep === undefined) return;
  const draft = {
    quizId: quizActive.id,
    quizTitle: quizActive.title,
    quizStep: quizStep,
    quizAns: quizAns,
    returnTo: returnTo || null,
    savedAt: Date.now(),
  };
  state.quizDraft = draft;
  try { localStorage.setItem('lx_quiz_draft', JSON.stringify(draft)); } catch{}
}

function clearQuizDraft() {
  state.quizDraft = null;
  try { localStorage.removeItem('lx_quiz_draft'); } catch{}
}

function resumeQuizDraft() {
  const draft = state.quizDraft;
  if (!draft) return;
  const quiz = ALL_QUIZZES.find(q => q.id === draft.quizId) || QUIZZES.find(q => q.id === draft.quizId);
  if (!quiz) { clearQuizDraft(); return; }
  setState({
    quizActive: quiz,
    quizStep: draft.quizStep || 0,
    quizAns: draft.quizAns || {},
    quizResult: null,
    returnTo: draft.returnTo || null,
  });
}

function saveProfile(profile) {
  state.userProfile = profile;
  try { localStorage.setItem('lx_profile', JSON.stringify(profile)); } catch{}
}
function updateProfile(patch) {
  const newProfile = { ...(state.userProfile || {}), ...patch };
  saveProfile(newProfile);
}

// ─── 综合记忆上下文：汇聚用户所有数据，让 AI 拥有完整记忆 ──────────────────
function buildMemoryContext() {
  const sections = [];

  // ── 1. 基础档案 ──
  const p = state.userProfile;
  if (p) {
    const profileParts = [];
    if (p.nickname) profileParts.push('昵称：' + p.nickname);
    if (p.age) profileParts.push('年龄：' + p.age);
    if (p.gender) profileParts.push('性别：' + p.gender);
    if (p.grade) profileParts.push('年级：' + p.grade);
    if (p.major) profileParts.push('专业：' + p.major);
    if (p.concerns && p.concerns.length) profileParts.push('关注议题：' + p.concerns.join('、'));
    if (p.bio) profileParts.push('个性签名：' + p.bio);
    if (profileParts.length) sections.push('【基本信息】\n' + profileParts.join('\n'));
  }

  // ── 2. 测试历史（全部，含结果描述）──
  if (p && p.testHistory && p.testHistory.length > 0) {
    const tests = p.testHistory.map(t => {
      let line = `${t.date} ${t.testName}：${t.resultTitle}`;
      if (t.resultTag) line += `（${t.resultTag}）`;
      if (t.resultDesc) line += `\n  结果描述：${t.resultDesc.slice(0,120)}`;
      return line;
    }).join('\n');
    sections.push(`【心理测试历史】（共${p.testHistory.length}次）\n${tests}`);
  }

  // ── 3. 情绪日记与趋势分析 ──
  const diaries = state.moodDiaries || [];
  if (diaries.length > 0) {
    const recent = diaries.slice(0, 14); // 最近14天
    const lines = recent.map(d => {
      const sc = d.mood?.sc || 3;
      const moodLabel = d.mood?.lb || '未知';
      let line = `${d.date} 心情：${moodLabel}(${sc}/5)`;
      if (d.note) line += `，日记：「${d.note.slice(0,80)}」`;
      return line;
    }).join('\n');

    // 趋势分析
    const scores = recent.map(d => d.mood?.sc || 3);
    const avg = (scores.reduce((a,b)=>a+b,0) / scores.length).toFixed(1);
    const trend = scores.length >= 2
      ? (scores[0] > scores[scores.length-1] ? '下降趋势' : scores[0] < scores[scores.length-1] ? '上升趋势' : '平稳')
      : '数据不足';
    const moodStreak = (loadAchievements().moodStreak) || 0;
    sections.push(`【情绪记录】（最近${recent.length}天，平均心情${avg}/5，趋势：${trend}，连续记录${moodStreak}天）\n${lines}`);
  }

  // ── 4. 感恩日记 ──
  const grat = state.gratSaved || [];
  if (grat.length > 0) {
    const gratLines = grat.slice(0, 7).map(g =>
      `${g.date}：${g.items.join('；')}`
    ).join('\n');
    sections.push(`【感恩日记】（共${grat.length}篇，最近7篇）\n${gratLines}`);
  }

  // ── 5. 历史对话摘要 ──
  const chatHist = state.chatHistory || [];
  if (chatHist.length > 0) {
    const summaries = chatHist.slice(-8).map((s, i) => {
      const userMsgs = s.msgs.filter(m => m.role === 'user');
      if (!userMsgs.length) return null;
      const topics = userMsgs.slice(0, 3).map(m => m.text.slice(0, 60)).join(' → ');
      return `${s.time || ''}对话${chatHist.length - i}：${topics}`;
    }).filter(Boolean);
    if (summaries.length) {
      sections.push(`【历史对话记录】（共${chatHist.length}段，最近${summaries.length}段摘要）\n${summaries.join('\n')}`);
    }
  }

  // ── 6. 成长成就 ──
  const ach = loadAchievements();
  const achParts = [];
  if (ach.points) achParts.push(`成长积分：${ach.points}`);
  const tree = getTreeStage();
  achParts.push(`成长阶段：${tree.label}（${tree.hint}）`);
  if (ach.badges && ach.badges.length) {
    const badgeNames = ach.badges.map(id => (BADGES.find(b=>b.id===id)||{}).name).filter(Boolean);
    if (badgeNames.length) achParts.push(`已获徽章：${badgeNames.join('、')}`);
  }
  // 知识阅读统计
  const knowledgeCount = (ach.events||[]).filter(e=>e.type==='knowledge').length;
  if (knowledgeCount > 0) achParts.push(`已阅读科普文章：${knowledgeCount}篇`);
  // 呼吸练习统计
  const breatheCount = (ach.events||[]).filter(e=>e.type==='breathe').length;
  if (breatheCount > 0) achParts.push(`完成呼吸练习：${breatheCount}次`);
  if (achParts.length) sections.push(`【成长数据】\n${achParts.join('；')}`);

  if (!sections.length) return '';
  return '\n\n══════ 用户记忆档案（AI 应主动参考以下信息进行个性化回应）══════\n\n' +
    sections.join('\n\n') +
    '\n\n══════ 记忆使用指引 ══════\n' +
    '1. 你拥有以上用户的完整记忆。在对话中，应自然地参考这些信息，让对方感受到你记得他/她。\n' +
    '2. 如果对方提到的话题与过去的测试结果、情绪记录、日记内容相关，主动关联并提及。\n' +
    '3. 关注情绪趋势变化：如果近期心情持续走低，温和地表达关心；如果趋势上升，给予肯定。\n' +
    '4. 参考历史对话中的话题，避免重复建议，体现"我记得你上次说过…"的连续性。\n' +
    '5. 感恩日记内容可用于积极心理学的介入：强化已有的正向关注。\n' +

function setState(patch) {
  Object.assign(state, patch);
  if('darkMode' in patch) {
    document.body.classList.toggle('dark', state.darkMode);
    try { localStorage.setItem('lx_dark', state.darkMode?'1':'0'); } catch{}
  }
  render();
}

// Apply dark mode on boot
if(state.darkMode) document.body.classList.add('dark');

// ─── ONBOARDING ───────────────────────────────────────────────────────────────
function showOnboarding() {
  const ob = document.getElementById('onboarding');
  if(!ob) return;

  let cur = 0;
  const total = 4;
  const track = document.getElementById('ob-track');
  const nextBtn = document.getElementById('ob-next');
  const skipBtn = document.getElementById('ob-skip');

  // Reset to first slide
  if(track) track.style.transform = 'translateX(0)';
  for(let i=0;i<total;i++){
    const d = document.getElementById(`ob-dot-${i}`);
    if(d) d.classList.toggle('active', i===0);
  }
  if(nextBtn) nextBtn.textContent = '下一步';

  // Show
  ob.style.display = 'flex';
  ob.style.opacity = '1';
  ob.classList.remove('hiding');
  if(state.darkMode) ob.style.background = '#1A1A1E';
  else ob.style.background = '#F5F2EE';

  // Animate first icon
  const icons = ob.querySelectorAll('.ob-icon-wrap');
  if(icons[0]) {
    icons[0].style.animation = 'none';
    void icons[0].offsetWidth;
    icons[0].style.animation = 'obIconIn .5s cubic-bezier(.34,1.56,.64,1) both';
  }

  function goTo(idx) {
    cur = idx;
    if(track) track.style.transform = `translateX(-${cur * 100}%)`;
    for(let i=0;i<total;i++){
      const d = document.getElementById(`ob-dot-${i}`);
      if(d) d.classList.toggle('active', i===cur);
    }
    if(nextBtn) nextBtn.textContent = cur === total-1 ? '立刻开始 🌿' : '下一步';
    const icons2 = ob.querySelectorAll('.ob-icon-wrap');
    if(icons2[cur]) {
      icons2[cur].style.animation = 'none';
      void icons2[cur].offsetWidth;
      icons2[cur].style.animation = 'obIconIn .5s cubic-bezier(.34,1.56,.64,1) both';
    }
  }

  function finish() {
    localStorage.setItem('lx_onboarded', '1');
    ob.classList.add('hiding');
    setTimeout(()=>{ ob.style.display='none'; ob.classList.remove('hiding'); }, 420);
  }

  // Re-bind every time to avoid stale closures
  if(nextBtn) nextBtn.onclick = () => { if(cur < total-1) goTo(cur+1); else finish(); };
  if(skipBtn) skipBtn.onclick = finish;

  // Swipe support (guard against duplicate listeners via flag)
  if(!ob._swipeBound) {
    ob._swipeBound = true;
    let startX = 0;
    ob.addEventListener('touchstart', e=>{ startX = e.touches[0].clientX; }, {passive:true});
    ob.addEventListener('touchend', e=>{
      const dx = e.changedTouches[0].clientX - startX;
      if(dx < -50 && cur < total-1) goTo(cur+1);
      if(dx > 50 && cur > 0) goTo(cur-1);
    }, {passive:true});
  }
}

// Auto-show on first visit
if(!localStorage.getItem('lx_onboarded')) {
  showOnboarding();
} else {
  document.getElementById('onboarding').style.display = 'none';
}

// 今日治愈：根据日期取当天内容
function getDailyContent() {
  const now = new Date();
  const dayIdx = Math.floor(now.getTime() / 86400000); // 每天变换
  const quote = DAILY_QUOTES[dayIdx % DAILY_QUOTES.length];
  const mindful = DAILY_MINDFULNESS[dayIdx % DAILY_MINDFULNESS.length];
  // 渐变配色：7种，每天循环
  const gradients = [
    {bg:'linear-gradient(135deg,#C8894A 0%,#E8B87A 100%)',shadow:'rgba(200,137,74,.2)'},
    {bg:'linear-gradient(135deg,#4A7A68 0%,#7AB8A0 100%)',shadow:'rgba(74,122,104,.2)'},
    {bg:'linear-gradient(135deg,#8870A8 0%,#B8A0D8 100%)',shadow:'rgba(136,112,168,.2)'},
    {bg:'linear-gradient(135deg,#A06868 0%,#D09888 100%)',shadow:'rgba(160,104,104,.2)'},
    {bg:'linear-gradient(135deg,#4A6A8A 0%,#7AAAC8 100%)',shadow:'rgba(74,106,138,.2)'},
    {bg:'linear-gradient(135deg,#7A8A4A 0%,#AABA78 100%)',shadow:'rgba(122,138,74,.2)'},
    {bg:'linear-gradient(135deg,#A87848 0%,#D8A878 100%)',shadow:'rgba(168,120,72,.2)'},
  ];
  const grad = gradients[dayIdx % gradients.length];
  return {quote, mindful, grad, dateStr: now.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'})};
}

    // 多个关键词匹配时额外加分
    const score = scene.weight + (matchCount - 1) * 8;
    if (score > bestScore) { bestScore = score; best = scene; }

  if (best) {

   content:[{h:"为什么早晨很重要？",p:"起床后的前30分钟是大脑可塑性最强的时刻，如何度过早晨会影响整天的情绪基调和注意力状态。"},{h:"5分钟晨间正念",p:"①闹钟响后不要立刻看手机，先躺1分钟感受身体。\n②坐起来，做3次深呼吸，感受新的一天的开始。\n③心里说出今天感恩的1件事（哪怕很小）。\n④设定今天的1个小目标（不需要很大）。\n⑤喝一杯温水，感受水在身体里流动的感觉。"},{h:"长期效益",p:"研究表明，坚持晨间正念4周，可显著降低压力水平、提升情绪稳定性和专注力。"}]},
];
const ARTS = [
  {cat:"神经科学 · 置顶",ic:"🧠",title:"为什么你越累越睡不着？",desc:"皮质醇与褪黑素的博弈，读懂疲劳性失眠的机制…",
   full:[{h:"疲劳≠困倦",p:"很多同学有这种体验：白天累到不行，一躺下脑子又开始转。「疲劳」是身体能量耗尽，「困倦」是大脑准备好入睡，这是两种不同的状态。"},{h:"皮质醇的作用",p:"当你持续处于压力下，身体分泌皮质醇（压力激素）维持运转。皮质醇会抑制褪黑素的分泌，而褪黑素正是帮助你入睡的激素。这就是为什么越疲惫越难入睡。"},{h:"如何打破循环",p:"①在睡前2小时降低刺激：关掉工作相关内容，避免高强度运动。\n②用「程序」告诉大脑该睡了：固定时间洗澡、读书（非手机）、关灯。\n③接受而非抗拒：越焦虑「我必须睡着」，皮质醇反而越高。"}]},
  {cat:"人际关系",ic:"🤝",title:"如何与室友沟通才不尴尬？",desc:"非暴力沟通的四步骤，让宿舍关系更和谐…",
   full:[{h:"为什么宿舍矛盾这么难开口？",p:"和室友的矛盾不比陌生人，因为你们还要继续住在一起。怕伤感情、怕被认为小题大做，很多同学选择憋着，结果越积越多。"},{h:"非暴力沟通四步骤",p:"①观察（不评价）：「这周你晚上12点后才回来」\n②感受：「我有点难以入睡」\n③需要：「我睡眠比较浅，需要安静的环境」\n④请求（可协商）：「你能不能回来后轻一点？」"},{h:"小技巧",p:"选择对方心情好的时候谈 / 用「我」开头而不是「你」 / 对事不对人 / 给对方表达的空间"}]},
  {cat:"情绪管理",ic:"🌊",title:"认识你的情绪调节系统",desc:"前额叶与杏仁核的博弈——读懂情绪的神经机制…",
   full:[{h:"大脑的「情绪警报器」",p:"杏仁核是大脑的情绪中心，负责识别威胁并触发情绪反应——焦虑、愤怒、恐惧都从这里发出。它反应极快，往往在你「想清楚」之前就已经触发了。"},{h:"前额叶：理性的声音",p:"前额叶皮质负责理性思考、调节情绪。当它活跃时，你能够「退一步想想」。但在高压和疲劳时，前额叶的控制力会减弱，杏仁核更容易占主导。"},{h:"如何增强前额叶的控制力",p:"①命名情绪：说出「我感到焦虑」就能激活前额叶。\n②深呼吸：刺激迷走神经，激活副交感神经系统。\n③运动：30分钟有氧运动后，前额叶活性显著提升。\n④充足睡眠：睡眠不足直接削弱前额叶功能。"}]},
  {cat:"心理韧性",ic:"💪",title:"失败之后，如何重新站起来",desc:"心理弹性的科学，以及你能做的五件事…",
   full:[{h:"什么是心理韧性？",p:"心理韧性不是「感受不到痛苦」，而是在经历痛苦后，依然能够恢复、适应甚至成长的能力。研究表明它不是天生的，而是可以培养的。"},{h:"五件你现在就能做的事",p:"①允许自己悲伤：压抑情绪会消耗更多心理资源。\n②找到可控的小事：整理桌面、完成一项作业——重建掌控感。\n③换一个叙事框架：不是「我失败了」，而是「这次没成功，我从中学到了……」\n④寻求连接：与信任的人分享，孤独会放大痛苦。\n⑤给自己时间：心理伤口和身体伤口一样，愈合需要时间。"}]},
  {cat:"大学适应",ic:"🎓",title:"大一入学焦虑，很正常",desc:"为什么这么多人开学就崩溃？如何平稳度过适应期…",
   full:[{h:"适应期的本质",p:"进入大学，几乎所有的外部参照都消失了：没有父母的日常照料，没有老师的时刻督促，没有熟悉的朋友，没有确定的节奏。这种「失重感」是触发焦虑的主要原因，不是你的问题，是环境巨变后的正常反应。"},{h:"最常见的适应困难",p:"① 和室友相处不来，感到格格不入\n② 课程难度突然提升，跟不上节奏\n③ 对专业不感兴趣，后悔选择\n④ 想家，思念原来的环境和朋友\n⑤ 感到孤独，建立友谊比想象中难"},{h:"经过验证的应对方法",p:"① 给自己一个「适应期」：三个月内有不适是正常的，不要急着下结论\n② 主动做一件小事：加入一个社团、和同学一起吃一顿饭，打破陌生感\n③ 保持一个熟悉的习惯：和高中一样的运动、音乐、爱好，锚定自我\n④ 允许想家：想家不是脆弱，是你有值得珍惜的东西\n⑤ 用语言表达：对辅导员或心理老师说「我不太适应」，这本身就是一种力量"}]},
  {cat:"学业压力",ic:"📚",title:'"我好像越来越不会学习了"',desc:"学习动力消失、效率低下背后的心理机制…",
   full:[{h:"为什么大学生容易失去学习动力？",p:"高中时，外部压力（高考、老师、家长）是主要驱动力。进入大学，这些外部压力消失，而内在动机还没有建立起来，就会出现「漂浮感」——知道要学，但就是提不起劲。"},{h:"「拖延」背后的真实原因",p:"拖延通常不是懒，而是一种情绪回避。面对任务时产生的焦虑、自我怀疑、对失败的恐惧，让大脑选择逃进手机或娱乐来获取即时满足感。越拖，罪恶感越重，越难开始，形成恶性循环。"},{h:"打破循环的方法",p:"① 两分钟规则：任何任务，先只做2分钟，之后大脑通常会继续\n② 缩小目标：不是「完成这篇论文」而是「写100个字」\n③ 环境设计：换一个学习场所，减少手机干扰\n④ 接受「够好」：完成好过完美，先完成再优化\n⑤ 识别情绪：拖延前问自己「我在逃避什么感受」"}]},
  {cat:"情感心理",ic:"💛",title:"失恋后，我能做什么？",desc:"分手的痛是真实的，科学地走出来…",
   full:[{h:"失恋的痛是真实的神经反应",p:"研究发现，失恋激活的大脑区域和身体疼痛高度重叠——所以分手的痛是「真实」的疼痛，不是矫情。了解这一点，能帮助你对自己更宽容。"},{h:"正常的痛苦时间线",p:"心理学研究显示，大多数人在分手后3-6个月内情绪最低谷，之后逐渐改善。但每个人不同——有人两周恢复，有人需要一年。没有「正确」的时间表，不要逼自己「快点好起来」。"},{h:"有效的自我帮助",p:"① 允许悲伤：压抑情绪会让它持续更久，好好哭一场反而恢复更快\n② 切断刺激：在痛苦期减少查看对方动态的频率\n③ 重建生活结构：规律作息、运动、和朋友在一起\n④ 重新认识自己：失恋是重新了解「没有这段关系的我是谁」的机会\n⑤ 不要急于开始新关系：给自己时间真正愈合"},{h:"需要警惕的信号",p:"如果超过3个月仍无法正常生活、学习、睡眠，或出现伤害自己的念头，请认真寻求心理支持。这不是「想开点」能解决的，需要专业帮助。"}]},
  {cat:"人际关系",ic:"👥",title:"社恐了怎么办？",desc:"内向、害羞与社交焦虑的区别，以及可以做的事…",
   full:[{h:"三个容易混淆的概念",p:"内向：天生更喜欢独处或小圈子，独处是充电方式，不是病。\n害羞：面对陌生人时的羞涩感，多数人都有，程度不同。\n社交焦虑：对社交场合有强烈恐惧，会主动回避，影响日常生活。前两者是性格特质，社交焦虑是需要被认真对待的心理状态。"},{h:"社交焦虑的常见表现",p:"害怕被人评价或嘲笑 / 说话前反复措辞，说完反复回想 / 在人多的地方呼吸困难或脸红 / 因为害怕而拒绝一些机会 / 独处时反复回放「社交事故」"},{h:"可以尝试的方法",p:"① 从低风险社交开始：点餐时多说一句话，和同学打个招呼\n② 关注「做了什么」而不是「感觉如何」：行动优先于感受\n③ 接受「不完美的表现」：说错一句话不会导致灾难\n④ 认知挑战：问自己「最坏的情况是什么？它发生的概率有多大？」\n⑤ 如果症状严重影响生活，认知行为治疗（CBT）对社交焦虑效果显著"}]},
  {cat:"自我成长",ic:"🌱",title:"你不是「废物」，你只是倦怠了",desc:"大学生倦怠综合征：识别、理解与走出…",
   full:[{h:"什么是倦怠？",p:"倦怠（Burnout）不是懒，是长期过度付出后身心资源的耗尽。它有三个核心特征：情绪耗竭（什么都提不起劲）、去人格化（对曾经喜欢的事变得冷漠）、成就感降低（觉得自己做什么都没用）。"},{h:"大学生倦怠的特殊之处",p:"大学的倦怠往往不是「太忙了」造成的，而是「付出和意义感脱节」。你可能在拼命学习，但不知道为什么，或者感觉努力没有回报。这种「空转」是最耗能的状态。"},{h:"走出倦怠的路径",p:"① 先停下来：倦怠时强迫自己继续只会更糟，允许自己休息\n② 找回一件「只为自己」的事：不为绩点、不为未来，就是喜欢\n③ 降低标准：从「要做好」到「先做完」，恢复行动感\n④ 和人说话：倦怠时人容易孤立，说出来能打破这个循环\n⑤ 重新连接意义：问自己「如果没有这些外部压力，我想做什么？」"}]},
  {cat:"情绪管理",ic:"😤",title:"愤怒来了，怎么办？",desc:"不是压下去，而是健康地释放与转化…",
   full:[{h:"愤怒是信号，不是敌人",p:"愤怒的本质是「我的某个重要需求或边界被侵犯了」的信号。压抑愤怒不会让它消失，它会积累，转化成更持久的抑郁、冷漠或爆发。"},{h:"愤怒时大脑发生了什么",p:"愤怒触发杏仁核，让前额叶「下线」——这就是为什么激动时我们会说出事后后悔的话。了解这个机制，能帮助我们在愤怒升级前给自己一个「暂停」。"},{h:"即时冷静的方法",p:"① 物理离开现场：暂时离开激发愤怒的环境，给大脑降温\n② 4-7-8呼吸：吸气4秒、屏息7秒、呼气8秒，激活副交感神经\n③ 延迟反应：「我需要想一想再回复你」是成熟的边界设置\n④ 运动释放：快走、跑步、打球，让肾上腺素通过身体释放出去"},{h:"事后处理",p:"① 找出真正的需求：愤怒背后是什么？被忽视？不被尊重？压力太大？\n② 用「我」陈述表达：「我感到很难受，因为……」而不是「你总是……」\n③ 若伤害了别人，事后真诚道歉并解释情绪来源"}]},
  {cat:"家庭关系",ic:"🏠",title:"和父母吵架了，怎么办？",desc:"大学生最常见的家庭冲突模式与应对…",
   full:[{h:"为什么大学阶段家庭冲突会增加？",p:"上大学意味着你开始真正「分离」——形成自己的价值观、交友方式、生活节奏。这个过程不可避免地和父母产生摩擦，因为他们还记得「那个需要照顾的你」，而你需要的空间越来越大。"},{h:"最常见的冲突类型",p:"① 专业/就业方向不认同：「你学这个有什么用？」\n② 恋爱问题：父母不认可你的另一半\n③ 生活方式分歧：作息、消费、社交\n④ 过度控制与侵犯隐私\n⑤ 情感表达不畅：明明关心，但表达方式让人窒息"},{h:"有效的处理方式",p:"① 冷静期先冷静：激烈争吵后立刻沟通往往适得其反，给双方一天时间\n② 理解代际差异：父母的担忧来自他们成长时期的现实，不是恶意\n③ 表达感受而非指控：「我感到被不信任，这让我很难受」比「你从来不理解我」更容易被听见\n④ 在小事上让步，在核心问题上坚持：知道哪些值得battle\n⑤ 找到共同语言：父母真正担心的通常是你的安全、幸福和未来，从这里出发沟通"}]},
  {cat:"自我认知",ic:"🪞",title:"我真的了解自己吗？",desc:"认识「真实的自我」与「表演的自我」…",
   full:[{h:"两种自我",p:"我们都有「给别人看的自我」和「独处时的自我」。问题是，当我们过度迎合外部期待时，「表演的自我」会越来越强，「真实的自我」越来越模糊，最终我们连自己都不知道：我到底是什么样的人？我真正想要什么？"},{h:"认识真实自我的信号",p:"以下问题值得认真思考：\n① 做什么事情时，你会忘记时间？\n② 什么情境下你会感到充实（不是开心，是充实）？\n③ 你最害怕别人知道你的哪一面？\n④ 你的核心价值观是什么（不是父母的、社会的）？\n⑤ 如果没有任何评价，你会怎么生活？"},{h:"建立自我认知的方法",p:"① 写日记：不为给别人看，诚实记录想法和感受\n② 观察「情绪的边界」：什么让你感到愤怒或委屈？这指向你真正在乎的东西\n③ 尝试新体验：自我认知需要素材，用行动去探索\n④ 接受模糊期：20岁左右还没想清楚「我是谁」是正常的，不是缺陷"}]},
  {cat:"心理健康常识",ic:"📋",title:"什么时候该找心理咨询？",desc:"消除误区：心理咨询不是「有病才去」…",
   full:[{h:"关于心理咨询最大的误解",p:"很多人认为心理咨询是「心理有问题」才去的。实际上，心理咨询更像是「健身房」——你不需要受伤才能去健身，你也不需要崩溃才能去咨询。任何时候你觉得「有些事想和专业的人聊聊」，都是合适的时机。"},{h:"这些情况下，咨询是有帮助的",p:"① 持续两周以上的低落、焦虑、空洞感\n② 学习、睡眠、人际关系受到明显影响\n③ 反复有相同的困扰，自己解决不了\n④ 经历了重大失去（失恋、考试失败、家庭变故）\n⑤ 只是想整理一下自己的思路，找人倾听\n⑥ 人际关系中反复出现相似的问题"},{h:"找学校咨询的实用建议",p:"① 主动找辅导员或心理健康中心询问预约方式\n② 第一次咨询前写下你想聊的主要困扰（1-3个）\n③ 咨询师不会替你做决定，他/她帮助你更清楚地看见自己\n④ 如果第一个咨询师不合适，可以换人，这很正常\n⑤ 学校咨询通常免费，不用担心费用"}]},
,
  {cat:"自我认知",ic:"🪞",title:"什么是「讨好型人格」？",desc:"总是优先考虑别人感受，内心却越来越疲惫…",
   full:[{h:"讨好型人格的本质",p:"讨好型人格（也叫「取悦症」）的核心是：把他人的需求和感受放在自己之上，通过让别人满意来获得安全感和认可。这通常源于童年时学到的「只有我表现好/让别人开心，我才是安全的」的模式。"},{h:"常见表现",p:"· 难以拒绝别人，说「不」会感到极度愧疚\n· 总担心别人对自己不满意\n· 在意见分歧时，本能地顺着对方\n· 道歉比别人多，即使不是自己的错\n· 内心有很多委屈，但很少表达"},{h:"如何慢慢改变",p:"① 识别模式：当你感到「必须答应」时，先停顿3秒，问自己「我真的想这样做吗？」\n② 练习小拒绝：从低风险情境开始练习说不\n③ 区分「真诚的善良」和「出于恐惧的顺从」\n④ 允许别人不满意：对方的情绪不是你的责任\n⑤ 建立自我价值感：你的价值不取决于别人是否满意"}]},
  {cat:"焦虑管理",ic:"😤",title:"如何和「想太多」的自己和解？",desc:"反刍思维的成因与打破方法…",
   full:[{h:"什么是反刍思维？",p:"反刍思维是指反复回想同一件事——通常是痛苦的经历、失败、尴尬的瞬间或对未来的担忧——却没有推进解决问题。它像脑子里卡碟的CD，一遍遍重播。"},{h:"为什么大脑喜欢反刍？",p:"大脑的默认模式网络（DMN）在我们「无所事事」时最活跃，它会自动检索未解决的问题。这是进化遗留的机制——古代用来分析威胁，但现代的「威胁」（考试失利、被人误会）并不需要这么多反复分析。"},{h:"打破反刍的方法",p:"① 给「担心」安排专属时间：每天只在固定15分钟内允许自己担心，其他时间出现担心就说「等到那15分钟再想」\n② 行动导向替代分析导向：问自己「我能做什么」而不是「为什么会这样」\n③ 身体介入：散步、运动可以物理上打断大脑的反刍模式\n④ 写下来：把担忧写出来，能将它从「脑内无限循环」变成「有限的文字」\n⑤ 正念觉察：注意到自己在反刍时，不评判，只是温柔地把注意力带回当下"}]},
  {cat:"人际心理",ic:"🫂",title:"为什么你会感到孤独？",desc:"孤独感背后的心理机制，以及如何真正连接…",
   full:[{h:"孤独不等于独处",p:"孤独是一种主观感受——在人群中也可以感到孤独，独处时也可以感到充实。真正的孤独来自「渴望连接但感到连接不足」的落差。这种落差在大学阶段尤为普遍，因为旧有的支持网络（家人、高中朋友）消失了，新的还没建立。"},{h:"孤独的两种类型",p:"社交孤独：缺乏足够的社交互动，感到被隔绝\n情感孤独：虽然有社交，但缺乏深度、真实的情感连接\n大学里很多人的情况是「社交孤独」已经解决（认识了很多人），但「情感孤独」依然存在（没有能真正交心的朋友）。"},{h:"建立真实连接的方式",p:"① 自我披露：适度分享真实的自己（包括软弱的部分），才能引发真正的连接\n② 质量胜于数量：一个能深聊的朋友比十个点头之交更有价值\n③ 主动创造共同经历：一起经历某件事比说很多话更能建立联结\n④ 接受连接需要时间：真正的友谊通常需要6个月到1年的持续互动才能形成\n⑤ 允许自己有需求：主动联系别人不是麻烦，是给对方一个连接的机会"}]},
  {cat:"压力与健康",ic:"💪",title:"运动真的能改善情绪吗？",desc:"不是玄学，是神经科学——运动与大脑的关系…",
   full:[{h:"运动改善情绪的生物机制",p:"运动时，大脑分泌内啡肽（天然止痛剂）、多巴胺（奖励感）、血清素（情绪稳定剂）、去甲肾上腺素（注意力和能量）。这四种物质的组合，几乎就是抗抑郁药的作用机制。运动是经过科学验证的、最安全有效的情绪调节方式之一。"},{h:"多少运动才有效？",p:"研究表明：每周3次、每次30分钟的中等强度有氧运动（快走、慢跑、骑车），4-6周后可显著改善焦虑和情绪低落症状。不需要多剧烈，关键是持续和规律。"},{h:"从0开始的建议",p:"① 降低门槛：从每天10分钟开始，比什么都不做好100倍\n② 选择你喜欢的：跳绳、快走、羽毛球——形式不重要，坚持最重要\n③ 利用校园资源：大多数高校都有免费的操场和健身房\n④ 找个同伴：和朋友一起运动能显著提升坚持率\n⑤ 不要期待立竿见影：情绪改善通常在2-4周后才明显，坚持下去"}]}];

// ─── RENDER HELPERS ───────────────────────────────────────────────────────────
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'onclick') el.onclick = v;
      else if (k === 'oninput') el.oninput = v;
      else if (k === 'onkeydown') el.onkeydown = v;
      else if (k === 'style') Object.assign(el.style, v);
      else if (k === 'class') el.className = v;
      else if (k === 'value') el.value = v;
      else if (k === 'placeholder') el.placeholder = v;
      else if (k === 'rows') el.rows = v;
      else if (k === 'id') el.id = v;
      else el.setAttribute(k, v);
    }
  }
  for (const c of children) {
    if (c == null) continue;
    if (typeof c === 'string' || typeof c === 'number') el.appendChild(document.createTextNode(c));
    else if (c instanceof Node) el.appendChild(c);
    else if (Array.isArray(c)) c.forEach(item => {
      if (item == null) return;
      if (typeof item === 'string') el.appendChild(document.createTextNode(item));
      else if (item instanceof Node) el.appendChild(item);
    });
  }
  return el;
}

function card(style, ...children) {
  return h('div', {class:'card', style}, ...children);
}
function banner(bgClass, label, title, lines, icon) {
  return h('div', {class:`banner ${bgClass}`},
    h('div', null,
      h('div', {class:'label'}, label),
      h('h2', null, title),
      ...lines.map(l => h('div', {class:'sub'}, l))
    ),
    h('div', {class:'icon'}, icon)
  );
}
function secTitle(icon, text, extra) {
  const el = h('div', {class:'sec-title'}, h('span',null,icon), text);
  if (extra) el.appendChild(extra);
  return el;
}
function btn(text, style, onclick) {
  return h('button', {style, onclick}, text);
}

// Build quiz grid properly
function buildQuizGrid() {
  const grid = h('div', {class:'quiz-grid'});
  QUIZZES.forEach((q,qi) => {
    const c = card({padding:'16px',cursor:'pointer'});
    c.style.animationDelay = `${qi*0.05}s`;
    c.classList.add('card-enter');
    c.onclick = () => {
      if(!q.free||!q.questions.length) return;
      setState({quizActive:q,quizStep:0,quizAns:{},quizResult:null});
    };
    c.appendChild(h('div',{style:{fontSize:'28px',marginBottom:'8px'}},q.ic));
    c.appendChild(h('div',{style:{fontWeight:'700',fontSize:'14px',color:C.txt}},q.title));
    c.appendChild(h('div',{style:{fontSize:'11px',color:C.sub,margin:'2px 0 10px'}},q.count+' · '+q.time));

    c.appendChild(bar);
    grid.appendChild(c);
  });
  return grid;
}

      const canvas = document.getElementById('result-card-canvas');
      const ctx = canvas.getContext('2d');
      const W=600, H=400;
      ctx.clearRect(0,0,W,H);

      // Background gradient

      bg.addColorStop(0,'#C8894A'); bg.addColorStop(1,'#7A4818');
      ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

      // App logo area

      // Desc (wrap text)
      ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.font='15px PingFang SC,sans-serif';
      ctx.textAlign='center';
      const desc = quizResult.desc;
      const maxW=480, lineH=24;
      let words=desc, lines2=[], cur='';
      for(let i=0;i<words.length;i++){
        cur+=words[i];
        if(ctx.measureText(cur).width>maxW||i===words.length-1){
          lines2.push(cur); cur='';
        }
      }
      lines2.slice(0,3).forEach((l,i)=>ctx.fillText(l,W/2,252+i*lineH));

      // Footer divider
      ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(32,H-60); ctx.lineTo(W-32,H-60); ctx.stroke();

    btnRow.appendChild(genBtn);

    const dlBtn = btn('⬇ 保存图片',{flex:'1',padding:'12px',background:C.green,color:'#fff',border:'none',borderRadius:'10px',fontSize:'13px',fontWeight:'700',display:'none',alignItems:'center',justifyContent:'center'},()=>{

      a.href=dlBtn._dataURL;
      a.download=`聆心测试结果-${quizResult.title}.png`;
      a.click();
    });
    btnRow.appendChild(dlBtn);
    shareCard.appendChild(btnRow);

    // Copy hint
    shareCard.appendChild(h('div',{style:{fontSize:'11px',color:C.light,textAlign:'center',marginTop:'8px'}},'💡 手机端可长按图片保存，电脑端点击「保存图片」下载'));
    wrap.appendChild(shareCard);

    // Back button
    const backBtn = btn('返回测试列表',{width:'100%',padding:'14px',background:C.card,color:C.brown,border:`1.5px solid ${C.brown}`,borderRadius:'14px',fontSize:'15px',fontWeight:'700'},
      ()=>{clearQuizDraft();setState({quizActive:null,quizStep:0,quizAns:{},quizResult:null});});
    wrap.appendChild(backBtn);

    // ── 闭环反馈：告诉 AI 结果 ──
    const feedbackBtn = btn('💬 告诉 AI 我的结果',{
      width:'100%',padding:'14px',background:G_BROWN,
      color:'#fff',border:'none',borderRadius:'14px',fontSize:'15px',fontWeight:'700',marginTop:'10px'
    }, () => {
      const summary = `${quizActive ? quizActive.title : '测试'}结果：${quizResult.title}（${quizResult.tag}）。${quizResult.desc}`;
      agentSkillCompleted(quizActive ? quizActive.title : '心理测评', summary);
    });
    wrap.appendChild(feedbackBtn);
    return wrap;
  }

  if (quizActive) {
    const q = quizActive.questions[quizStep];
    const pct = ((quizStep+1)/quizActive.questions.length)*100;
    const wrap = h('div',{style:{padding:'0',background:C.bg,minHeight:'100%'}});
    const body = h('div',{style:{padding:'12px 20px'}});
    body.appendChild(h('div',{style:{fontSize:'12px',color:C.sub,marginBottom:'8px'}},`第 ${quizStep+1} 题，共 ${quizActive.questions.length} 题`));
    const prog = h('div',{class:'progress'});
    prog.appendChild(h('div',{class:'progress-fill',style:{width:`${pct}%`}}));
    body.appendChild(prog);
    body.appendChild(h('p',{style:{fontSize:'16px',fontWeight:'600',color:C.txt,margin:'0 0 16px',lineHeight:'1.5'}},q.q));
    q.opts.forEach((o,i)=>{
      const ob = btn(o,{
        padding:'14px 16px',borderRadius:'12px',fontSize:'14px',textAlign:'left',
        border:`1.5px solid ${quizAns[quizStep]===i?C.brown:C.border}`,
        background:quizAns[quizStep]===i?C.brownL:C.card,
        color:C.txt,width:'100%',marginBottom:'10px',fontWeight:'500',display:'block'
      },()=>setState({quizAns:{...quizAns,[quizStep]:i}}));
      body.appendChild(ob);
    });
    const row = h('div',{style:{display:'flex',gap:'10px'}});
    row.appendChild(btn('上一题',{flex:'1',padding:'14px',background:C.card,color:C.txt,border:`1.5px solid ${C.border}`,borderRadius:'14px',fontSize:'15px',fontWeight:'600'},
      ()=>quizStep>0?setState({quizStep:quizStep-1}):(clearQuizDraft(),setState({quizActive:null,quizStep:0,quizAns:{}}))));
    row.appendChild(btn('下一题 →',{flex:'2',padding:'14px',background:quizAns[quizStep]!==undefined?G_BROWN:C.border,color:'#fff',border:'none',borderRadius:'14px',fontSize:'15px',fontWeight:'700',opacity:quizAns[quizStep]===undefined?'0.6':'1'},
      ()=>{
        if(quizAns[quizStep]===undefined) return;
        if(quizStep<quizActive.questions.length-1){ setState({quizStep:quizStep+1}); }
        else {
          clearQuizDraft();
          // MBTI dimension-based scoring
          if (quizActive.id === 'mbti') {
            const scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
            quizActive.questions.forEach((q, idx) => {
              const ans = quizAns[idx];
              if (ans === undefined) return;
              const dim = MBTI_DIM_MAP[idx];
              if (!dim) return;
              const pole1 = dim[0], pole2 = dim[1];
              // 选项0,1偏向第一极(权重2,1)；选项2,3偏向第二极(权重1,2)
              if (ans < 2) scores[pole1] += (ans === 0 ? 2 : 1);
              else scores[pole2] += (ans === 3 ? 2 : 1);
            });
            const type = (scores.E>=scores.I?'E':'I') +
                         (scores.S>=scores.N?'S':'N') +
                         (scores.T>=scores.F?'T':'F') +
                         (scores.J>=scores.P?'J':'P');
            const ti = MBTI_TYPES[type] || MBTI_TYPES['INFP'];
            const r = {
              type:'mbti', mbtiType:type,
              title: type+' '+ti.name+' '+ti.emoji,
              tag: type+' · '+ti.name,
              desc: ti.desc,
              dimScores: scores
            };
            trackAction('quiz'); setState({quizResult:r});
          } else if (quizActive.id === 'bigfive' || quizActive.id === 'holland' || quizActive.id === '16pf') {
            const dimScores = {};
            const dimCounts = {};
            quizActive.questions.forEach((q, idx) => {
              const dim = q.dim;
              if (!dim) return;
              const rawScore = quizAns[idx] !== undefined ? quizAns[idx] : (q.opts ? Math.floor(q.opts.length/2) : 0);
              // For 5-point Likert: score 1-5; for 2-option: 0-1; for 4-option: 0-3
              const maxScore = q.opts ? q.opts.length - 1 : 1;
              const normalizedScore = q.rev ? (maxScore - rawScore) : rawScore;
              dimScores[dim] = (dimScores[dim] || 0) + normalizedScore;
              dimCounts[dim] = (dimCounts[dim] || 0) + 1;
            });
            // Normalize to 1-5 or 0-max scale
            Object.keys(dimScores).forEach(k => {
              const maxPossible = dimCounts[k] * ((quizActive.questions.find(q=>q.dim===k)?.opts?.length || 2) - 1);
              dimScores[k] = dimCounts[k] > 0 ? parseFloat((dimScores[k] / dimCounts[k]).toFixed(1)) : 0;
            });
            const r = { ...quizActive.results[0], dimScores, type: quizActive.id };
            trackAction('quiz'); setState({quizResult:r});
          } else {
            const tot=Object.values(quizAns).reduce((a,b)=>a+b,0);
            const r=quizActive.results.find(r=>tot>=r.range[0]&&tot<=r.range[1])||quizActive.results[quizActive.results.length-1];
            trackAction('quiz'); setState({quizResult:r});
          }
          // Auto-save test result to profile
          if (r && quizActive) {
            const prof = state.userProfile || {};
            if (!prof.testHistory) prof.testHistory = [];
            const isMultidim = r.type === 'bigfive' || r.type === 'holland' || r.type === '16pf' || r.type === 'mbti';
            let resultSummary = '';
            if (isMultidim && r.dimScores) {
              if (r.type === 'mbti') {
                resultSummary = r.mbtiType + ' · ' + (MBTI_TYPES[r.mbtiType]?.name || '');
              } else if (r.type === 'bigfive') {
                const labels = {O:'开放性',C:'尽责性',E:'外向性',A:'宜人性',N:'情绪稳定性'};
                resultSummary = Object.entries(r.dimScores).map(([k,v])=>labels[k]+':'+v).join(', ');
              } else if (r.type === 'holland') {
                const sorted = Object.entries(r.dimScores).sort((a,b)=>b[1]-a[1]);
                resultSummary = '霍兰德码:' + sorted.slice(0,3).map(([k])=>k).join('');
              } else if (r.type === '16pf') {
                resultSummary = '16PF剖面已生成';
              }
            }
            prof.testHistory.push({
              date: new Date().toLocaleDateString('zh-CN'),
              testName: quizActive.title,
              resultTitle: isMultidim ? resultSummary : (r.title || ''),
              resultTag: isMultidim ? '' : (r.tag || ''),
              resultDesc: isMultidim ? '' : (r.desc || ''),
              scores: isMultidim ? 0 : Object.values(quizAns).reduce((a,b)=>a+b,0)
            });
            if (prof.testHistory.length > 20) prof.testHistory = prof.testHistory.slice(-20);
            saveProfile(prof);
          }
        }
      }));
    body.appendChild(row);
    // ── 暂时离开按钮：保存进度，不中断测试 ──
    body.appendChild(btn('🚪 暂时离开',{width:'100%',padding:'12px',background:'none',color:C.sub,border:`1.5px solid ${C.border}`,borderRadius:'14px',fontSize:'13px',fontWeight:'600',marginTop:'8px'},()=>{
      saveQuizDraft();
      const dest = state.returnTo || 'quiz';
      setState({page:dest, quizActive:null, quizStep:0, quizAns:{}});
    }));
    wrap.appendChild(body);
    return wrap;
  }

  const wrap = h('div',{style:{padding:'4px 0 20px'}});
  wrap.appendChild(banner('g-brown','TRENDING · 趣测馆','探索真实的你',['MBTI · 情商 · 压力自测','每一次测试都是一次自我发现'],'🏆'));
  wrap.appendChild(buildDailyCard());

  // ── 继续上次测试（有未完成的草稿时显示）──
  if (state.quizDraft) {
    const draft = state.quizDraft;
    const quiz = ALL_QUIZZES.find(q => q.id === draft.quizId) || QUIZZES.find(q => q.id === draft.quizId);
    if (quiz) {
      const totalQ = quiz.questions ? quiz.questions.length : 0;
      const answered = Object.keys(draft.quizAns || {}).length;

      const draftCard = card({padding:'16px',marginBottom:'16px',border:`2px solid ${C.brown}`,background:C.brownL});
      draftCard.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px'}},

        )

      const draftBar = h('div',{style:{height:'6px',background:C.card,borderRadius:'3px',overflow:'hidden',marginBottom:'10px'}});
      draftBar.appendChild(h('div',{style:{height:'100%',width:pct+'%',background:C.brown,borderRadius:'3px',transition:'width .3s'}}));

      draftRow.appendChild(btn('放弃',{flex:'1',padding:'12px',background:C.card,color:C.sub,border:`1.5px solid ${C.border}`,borderRadius:'10px',fontSize:'13px',fontWeight:'600'},()=>{clearQuizDraft();render();}));
      draftCard.appendChild(draftRow);
      wrap.appendChild(draftCard);
    }
  }

  wrap.appendChild(secTitle('🔥','热门测试'));
  wrap.appendChild(buildQuizGrid());
  wrap.appendChild(secTitle('📋','全部测试'));
  ALL_QUIZZES.forEach(q=>{
    const el = card({padding:'14px 16px',display:'flex',alignItems:'center',gap:'14px',marginBottom:'8px',cursor:'pointer'});
    el.onclick = ()=>setState({quizActive:q,quizStep:0,quizAns:{},quizResult:null});
    el.appendChild(h('div',{style:{width:'44px',height:'44px',borderRadius:'12px',background:C.bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px',flexShrink:'0'}},q.ic));
    el.appendChild(h('div',{style:{flex:'1'}},h('div',{style:{fontWeight:'600',fontSize:'14px',color:C.txt}},q.title),h('div',{style:{fontSize:'11px',color:C.sub,marginTop:'2px'}},q.desc)));
    el.appendChild(h('div',{style:{fontSize:'11px',color:C.brown,fontWeight:'600'}},q.cnt));
    wrap.appendChild(el);
  });
  return wrap;
}

function renderChat() {
  const {chatMsgs, chatInput, chatLoading} = state;

  const wrap = h('div',{style:{display:'flex',flex:'1',minHeight:'0'}});

  {
    const {showHistory, chatHistory} = state;

    if(showHistory) {

          if(!confirm('确定清空所有历史对话？')) return;
          localStorage.removeItem('lx_chat_history');
          setState({chatHistory:[]});
        });
        headBtns.appendChild(clearBtn);
      }
      headBtns.appendChild(btn('× 关闭',{background:'none',border:'none',color:C.sub,fontSize:'13px',cursor:'pointer',padding:'4px 8px',fontFamily:'inherit'},()=>setState({showHistory:false})));
      histHead.appendChild(headBtns);
      histWrap.appendChild(histHead);
      const histList = h('div',{style:{flex:'1',overflowY:'auto',padding:'12px 16px'}});
      if(chatHistory.length===0) {
        histList.appendChild(h('div',{style:{textAlign:'center',color:C.light,fontSize:'13px',padding:'40px 0'}},'还没有历史对话记录，开始你的第一次聊天吧 🌿'));
      } else {
        [...chatHistory].reverse().forEach((session, idx)=>{
          const realIdx = chatHistory.length - 1 - idx;
          const card2 = card({padding:'14px 16px',marginBottom:'10px',cursor:'pointer'});
          card2.style.animationDelay = `${idx*0.04}s`;
          card2.classList.add('card-enter');
          card2.onclick = ()=>setState({chatMsgs:session.msgs, showHistory:false})
    // 自动滚动到底部
    setTimeout(() => {
      const msgsEl = document.querySelector('.chat-msgs');
      if (msgsEl) msgsEl.scrollTop = msgsEl.scrollHeight;
    }, 50);;
          const firstMsg = session.msgs.find(m=>m.role==='user');
          const preview = firstMsg ? firstMsg.text.slice(0,40)+(firstMsg.text.length>40?'…':'') : '（空对话）';
          const timeStr = session.time || '';
          const topRow = h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'6px'}});
          topRow.appendChild(h('div',{style:{fontSize:'12px',color:C.sub}},`对话 ${chatHistory.length-idx}`));
          const rightPart = h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}});
          rightPart.appendChild(h('div',{style:{fontSize:'11px',color:C.light}},timeStr));
          const delBtn = btn('删除',{background:'none',border:'none',color:'#E07070',fontSize:'11px',fontWeight:'600',cursor:'pointer',padding:'2px 8px',borderRadius:'6px',fontFamily:'inherit'},(e)=>{
            e.stopPropagation();
            const newHist = state.chatHistory.filter((_,i)=>i!==realIdx);
            localStorage.setItem('lx_chat_history', JSON.stringify(newHist));
            setState({chatHistory:newHist});
          });
          delBtn.onmouseenter = ()=>{ delBtn.style.background='#FEE2E2'; };
          delBtn.onmouseleave = ()=>{ delBtn.style.background='none'; };
          rightPart.appendChild(delBtn);
          topRow.appendChild(rightPart);
          card2.appendChild(topRow);
          card2.appendChild(h('div',{style:{fontSize:'13px',color:C.txt}},preview));
          card2.appendChild(h('div',{style:{fontSize:'11px',color:C.light,marginTop:'4px'}},`共 ${session.msgs.filter(m=>m.role==='user').length} 条消息`));
          histList.appendChild(card2);
        });
      }
      histWrap.appendChild(histList);
      chatRight.appendChild(histWrap);
    } else {
    // ── 正常对话视图 ──────────────────────────────────────────────
    const aiWrap = h('div',{style:{display:'flex',flexDirection:'column',flex:'1',overflow:'hidden'}});

    // 新对话 & 历史 按钮栏
    const chatToolbar = h('div',{style:{display:'flex',gap:'8px',padding:'10px 14px',borderBottom:`1px solid ${C.border}`,background:C.card,flexShrink:'0',alignItems:'center',flexWrap:'wrap'}});
    chatToolbar.appendChild(btn('+ 新对话',{padding:'6px 14px',borderRadius:'20px',fontSize:'12px',fontWeight:'600',background:G_BROWN,color:'#fff',border:'none'},()=>{
      // 保存当前对话到历史
      const cur = state.chatMsgs;
      if(cur.length > 1) {
        const hist = [...state.chatHistory, {
          msgs: cur,
          time: new Date().toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})+' '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),
          id: Date.now()
        }].slice(-30);
        localStorage.setItem('lx_chat_history', JSON.stringify(hist));
        _lastTopic = null; _turnCount = 0;
        _agentShownSkills = new Set();
        _agentMemory = {intents:[],severities:[],shownLabels:[],completedSkills:[]};
        setState({chatMsgs:[{role:'ai',text:getGreeting()}], chatHistory:hist});
      } else {
        _agentShownSkills = new Set();
        _agentMemory = {intents:[],severities:[],shownLabels:[],completedSkills:[]};
        setState({chatMsgs:[{role:'ai',text:getGreeting()}]});
      }
    }));
    chatToolbar.appendChild(btn('📋 历史记录',{padding:'6px 14px',borderRadius:'20px',fontSize:'12px',fontWeight:'600',background:C.bg,color:C.sub,border:`1px solid ${C.border}`},()=>setState({showHistory:true})));
    chatToolbar.appendChild(btn('👤 个人档案',{padding:'6px 14px',borderRadius:'20px',fontSize:'12px',fontWeight:'600',background:C.bg,color:C.sub,border:`1px solid ${C.border}`},()=>setState({page:'profile',returnTo:'chat'})));
    aiWrap.appendChild(chatToolbar);

    const msgsDiv = h('div',{class:'chat-msgs'});
    chatMsgs.forEach(m=>{
      const row = h('div',{style:{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',marginBottom:'16px',gap:'8px'}});
      const bubbleRow = row; bubbleRow.classList.add(m.role==='user'?'bubble-in-right':'bubble-in-left');
      if(m.role!=='user') { const aiAv = h('div',{class:'avatar',style:{background:G_BROWN,alignSelf:'flex-end'}}); aiAv.innerHTML = AI_AVATAR_SVG; row.appendChild(aiAv); }
      const col = h('div',null);
      col.appendChild(h('div',{class:`bubble ${m.role==='user'?'user':'ai'}`},m.text));
      col.appendChild(h('div',{style:{fontSize:'10px',color:C.light,marginTop:'3px',textAlign:m.role==='user'?'right':'left'}},new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})));
      row.appendChild(col);
      if(m.role==='user') row.appendChild(h('div',{class:'avatar',style:{background:'#F0D8C0',alignSelf:'flex-end'}},'👤'));
      msgsDiv.appendChild(row);
    });
    // 只在还没有流式内容时显示加载动画（避免流式时出现双头像）
    const lastMsg = chatMsgs[chatMsgs.length - 1];
    const isStreaming = lastMsg && lastMsg.role === 'ai';
    if(chatLoading && !isStreaming) {
      const row = h('div',{style:{display:'flex',gap:'8px',marginBottom:'16px'}});
      const aiAv2 = h('div',{class:'avatar',style:{background:G_BROWN}}); aiAv2.innerHTML = '<svg width="20" height="20" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 21.5C13 21.5 3.5 15.2 3.5 9.2C3.5 6.4 5.7 4.2 8.5 4.2C10.2 4.2 11.7 5.1 12.6 6.4C12.8 6.7 13.2 6.7 13.4 6.4C14.3 5.1 15.8 4.2 17.5 4.2C20.3 4.2 22.5 6.4 22.5 9.2C22.5 15.2 13 21.5 13 21.5Z" fill="rgba(255,255,255,0.3)"/><path d="M7.5 13 Q9 10.5 10.5 13 Q12 15.5 13.5 13 Q15 10.5 16.5 13 Q17.5 14.5 18.5 13" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>'; row.appendChild(aiAv2);
      const dots = h('div',{class:'bubble ai'});
      [0,1,2].forEach(i=>{ const d=h('span',{class:'dot-anim',style:{animationDelay:`${i*0.2}s`}}); dots.appendChild(d); });
      row.appendChild(dots); msgsDiv.appendChild(row);
    }
    aiWrap.appendChild(msgsDiv);
    setTimeout(()=>{ msgsDiv.scrollTo({top:msgsDiv.scrollHeight,behavior:"smooth"}); },10);

    // 恢复已展示的技能卡片（从子页面返回时卡片不丢失）
    const restoredKeys = [..._agentShownSkills];
    if (restoredKeys.length > 0) {
      appendAgentSkillCards(restoredKeys, null, msgsDiv, true);
    }

    const tags = h('div',{class:'mood-tags'});
    ['😤 压力大','😔 低落','😪 失眠','😣 矛盾','🌀 迷茫','😊 开心'].forEach(tg=>{
      const tb = btn(tg,{},()=>sendAI(tg));
      tb.className='mood-tag';
      tags.appendChild(tb);
    });
    aiWrap.appendChild(tags);

    const inputRow = h('div',{class:'chat-input-row'});
    const inp = h('input',{class:'chat-input',placeholder:'说说你的心情…',value:chatInput});
    inp.oninput = e=>{ state.chatInput=e.target.value; sb.style.opacity=(e.target.value.trim()&&!chatLoading)?'1':'0.5'; };
    inp.onkeydown = e=>{ if(e.key==='Enter') sendAI(); };
    // 语音按钮
    const micBtn = h('button',{style:{width:'44px',height:'44px',borderRadius:'50%',border:`1.5px solid ${C.border}`,background:C.card,fontSize:'18px',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:'0',cursor:'pointer',transition:'all .2s'}},'🎤');
    micBtn.title = '语音输入';
    micBtn.onclick = () => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { alert('当前浏览器不支持语音识别，请使用 Chrome'); return; }
      if (state.chatListening) return;
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.interimResults = true;
      recognition.continuous = false;
      setState({chatListening:true});
      micBtn.style.background = '#FEE2E2'; micBtn.style.borderColor = '#E07070'; micBtn.textContent = '🔴';
      inp.placeholder = '正在聆听…';
      recognition.onresult = (e) => {
        const text = Array.from(e.results).map(r=>r[0].transcript).join('');
        inp.value = text; state.chatInput = text;
        sb.style.opacity = text.trim()?'1':'0.5';
      };
      recognition.onerror = () => {
        setState({chatListening:false});
        micBtn.style.background = C.card; micBtn.style.borderColor = C.border; micBtn.textContent = '🎤';
        inp.placeholder = '说说你的心情…';
      };
      recognition.onend = () => {
        setState({chatListening:false});
        micBtn.style.background = C.card; micBtn.style.borderColor = C.border; micBtn.textContent = '🎤';
        inp.placeholder = '说说你的心情…';
        if (state.chatInput.trim()) { sendAI(); }
      };
      recognition.start();
    };
    const sb = btn('▶',{},()=>{ if(!state.chatInput.trim()||state.chatLoading) return; sendAI(); });
    sb.className='send-btn';
    if(!chatInput.trim()||chatLoading) sb.style.opacity='0.5';
    inputRow.appendChild(inp); inputRow.appendChild(micBtn); inputRow.appendChild(sb);
    aiWrap.appendChild(inputRow);
    chatRight.appendChild(aiWrap);
    } // end else (showHistory)
  }

  return wrap;
}

// ── 层1：意图识别 ── 轻量 250 token，返回结构化 actions 数组 ──────────
async function agentDispatch(userText, history, signal) {
  if (signal?.aborted) return null;
  try {
    const res = await fetch(API_URL, {
      signal,
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 250,
        temperature: 0.2,
        messages: [
          {
            role: 'system',
            content: `你是聆心心理健康平台的临床智能调度器。基于心理学专业判断，分析用户的情绪状态和需求层次，从技能库中选出最匹配的干预方案。

评估维度：
- 情绪类型和潜在心理需求（表面情绪背后的核心心理需求）
- 严重性（severity）：1-5级，5级为危机状态需立即关注
- 用户当前处于认知、情绪、还是行为层面的困扰，选择对应层面的干预

只返回纯JSON，不要任何额外文字或代码块符号：
{"intent":"焦虑|抑郁|压力|失眠|愤怒|孤独|学业|感情|人际|自我认知|放松|积极|危机|中性","severity":1到5,"actions":["chat","技能key"],"reply_hint":"一句给AI心理顾问的专业状态备注，说明当前用户的心理需求和可能的干预方向"}

【本轮对话记忆】
${buildMemorySummary() ? buildMemorySummary() + '\n基于以上历史，请升级推荐（不要重复已推荐的技能），并综合趋势选择更深入的干预。' : '本轮首次推荐。'}

技能库（按场景选1-2个最匹配的，chat必须包含）：
【心情馆放松】breath(呼吸) meditate(冥想) gratitude(感恩日记) doodle(涂鸦) diary(心情日记)
【趣测馆-热门】quiz_mbti(性格) quiz_stress(压力) quiz_eq(情商) quiz_phq(PHQ-9抑郁)
【趣测馆-全部】quiz_love(恋爱依恋) quiz_gad7(GAD-7焦虑) quiz_sleep(睡眠) quiz_resilience(心理韧性) quiz_ses(罗森伯格自尊量表) quiz_bigfive(大五人格OCEAN) quiz_holland(霍兰德职业兴趣RIASEC) quiz_16pf(16PF人格因素)
【知愈馆-贴士】tip_breath478(呼吸法) tip_grounding(落地法) tip_sleep(睡前冥想) tip_morning(晨间正念)
【知愈馆-科普】art_sleep(失眠机制) art_roommate(室友沟通) art_emotion(情绪系统) art_resilience(失败后站起来) art_adapt(大一适应) art_procrastinate(学习动力) art_breakup(失恋) art_social(社恐) art_burnout(倦怠) art_anger(愤怒) art_family(家庭冲突) art_lonely(孤独)

选择原则：
- 焦虑/紧张 → breath或tip_breath478 + quiz_gad7
- 抑郁/低落/失去兴趣 → quiz_phq + meditate 或 art_emotion

- 室友/人际矛盾 → art_roommate 或 art_social
- 孤独/被孤立 → art_lonely + meditate
- 愤怒/情绪爆发 → art_anger + breath
- 学业/拖延/挂科 → art_procrastinate + quiz_stress

- 想放松 → doodle 或 gratitude

- 危机信号(不想活/轻生) → 只返回chat，severity=5
- 积极/没啥事 → 只返回chat`
          },
          ...history.slice(-4).map(m => ({ role: m.role==='ai'?'assistant':'user', content: m.text })),
          { role: 'user', content: userText }
        ]
      })
    });
    if (!res.ok) return null;
    const data = await res.json();
    const raw = (data.choices?.[0]?.message?.content || '').trim();
    const clean = raw.replace(/^```json\s*/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    return JSON.parse(clean);
  } catch(e) {

const MODULE_STYLE = {

// ── 去重 Set：记录本次对话已推荐的技能 key，新对话时重置 ──────────────
let _agentShownSkills = new Set();

// ── Agent 对话记忆：跨轮追踪意图 + 推荐历史，新对话时重置 ──────────────
let _agentMemory = {
  intents: [],        // 本轮意图历史，如 ['焦虑','焦虑','压力']
  severities: [],     // 各轮 severity 数值
  shownLabels: [],    // 已推荐技能的 label（供 prompt 描述）
  completedSkills: [] // 用户完成并回报的技能，如 '呼吸放松'
};

// 记录一次推荐
function agentMemoryRecord(dispatch, registry, shownKeys) {
  if (!dispatch) return;
  if (dispatch.intent) _agentMemory.intents.push(dispatch.intent);
  if (dispatch.severity) _agentMemory.severities.push(dispatch.severity);
  shownKeys.forEach(k => {
    if (registry[k]) _agentMemory.shownLabels.push(registry[k].label);
  });
}

// 用户完成某个技能后调用
function agentSkillCompleted(skillLabel, resultSummary) {
  _agentMemory.completedSkills.push(skillLabel);
  _agentShownSkills.delete(
    Object.entries(SKILL_REGISTRY).find(([,v])=>v.label===skillLabel)?.[0] || ''
  );
  setState({
    page:'chat',
    activeRelax:null, breathPhase:null, breathCycle:0, medStarted:false, medStep:0,
    quizActive:null, quizStep:0, quizAns:{}, quizResult:null,
    kDetail:null, returnTo:null
  });
  const userMsg = `我刚完成了「${skillLabel}」${resultSummary ? '，帮我看看结果吧' : ''}`;
  const aiCtx = `[上下文] 用户刚完成了「${skillLabel}」${resultSummary ? '，完整结果：' + resultSummary : ''}。请在回复中自然地回应这个完成情况，可以结合结果给一些个性化的陪伴或建议。`;
  setTimeout(() => sendAI(userMsg, aiCtx), 300);
}

// 生成记忆摘要字符串，注入 dispatch prompt
function buildMemorySummary() {
  const parts = [];
  if (_agentMemory.intents.length > 0) {
    const freq = {};
    _agentMemory.intents.forEach(i => { freq[i] = (freq[i]||0)+1; });
    const top = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
    parts.push(`主要情绪：${top[0]}（共${_agentMemory.intents.length}轮）`);
  }
  if (_agentMemory.severities.length > 0) {
    const avg = (_agentMemory.severities.reduce((a,b)=>a+b,0)/_agentMemory.severities.length).toFixed(1);
    const trend = _agentMemory.severities.length >= 2
      ? (_agentMemory.severities.at(-1) > _agentMemory.severities[0] ? '上升' : '下降')
      : '稳定';
    parts.push(`严重度均值${avg}，趋势${trend}`);
  }
  if (_agentMemory.shownLabels.length > 0) {
    parts.push(`已推荐：${[...new Set(_agentMemory.shownLabels)].join('、')}`);
  }
  if (_agentMemory.completedSkills.length > 0) {
    parts.push(`已完成：${_agentMemory.completedSkills.join('、')}`);
  }
  return parts.length > 0 ? parts.join('；') : '';
}

// ── 层3：技能卡片渲染（含入场动画 + 去重）────────────────────────────
function appendAgentSkillCards(actions, dispatch, msgsDiv, isRestore) {
  if (!msgsDiv) return;
  const registry = SKILL_REGISTRY;

  // 去重：过滤掉本轮对话已推荐过的技能（恢复模式下跳过去重）
  const skillsToShow = (actions || [])
    .filter(a => a !== 'chat' && registry[a] && (isRestore || !_agentShownSkills.has(a)))
    .slice(0, 3);
  if (skillsToShow.length === 0) return;

  // 记入去重集合（恢复模式不重复记入）
  if (!isRestore) {
    skillsToShow.forEach(k => _agentShownSkills.add(k));
  }

  // 按模块分组
  const grouped = {};
  skillsToShow.forEach(key => {
    const sk = registry[key];
    if (!grouped[sk.module]) grouped[sk.module] = [];
    grouped[sk.module].push({ key, ...sk });
  });

  // 外层 wrapper：整体淡入上滑
  const wrapper = document.createElement('div');
  wrapper.className = 'agent-card-wrapper';
  wrapper.style.cssText = 'margin:0 0 16px 46px;';

  // 标题行
  const hd = document.createElement('div');
  hd.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:8px;';
  hd.appendChild(h('span',{style:{fontSize:'13px'}},'✨')); hd.appendChild(h('span',{style:{fontSize:'11px',color:C.sub,fontWeight:'600',letterSpacing:'.5px'}},'聆心为你推荐'));
  wrapper.appendChild(hd);

  // 每个模块一个分组，错开 80ms 产生瀑布感
  Object.entries(grouped).forEach(([moduleName, skills], groupIdx) => {
    const ms = MODULE_STYLE[moduleName] || MODULE_STYLE['知愈馆'];

    const group = document.createElement('div');
    group.className = 'agent-skill-group';
    group.style.cssText = `margin-bottom:8px;border-radius:14px;overflow:hidden;
      border:1px solid ${ms.border};animation-delay:${groupIdx * 80}ms;`;

    // 模块标签头
    const moduleTag = document.createElement('div');
    moduleTag.style.cssText = `padding:5px 12px;background:${ms.light};
      display:flex;align-items:center;border-bottom:1px solid ${ms.border};`;
    moduleTag.appendChild(h('span',{style:{fontSize:'10px',fontWeight:'700',color:ms.tc,letterSpacing:'.5px'}},moduleName));
    group.appendChild(moduleTag);

    // 技能行，每行再错开 50ms
    skills.forEach((sk, idx) => {
      const card2 = document.createElement('button');
      card2.style.cssText = `display:flex;align-items:center;gap:10px;padding:11px 14px;width:100%;
        background:${C.card};border:none;cursor:pointer;font-family:inherit;text-align:left;
        transition:background .18s,transform .15s;
        ${idx < skills.length - 1 ? `border-bottom:1px solid ${ms.border};` : ''}
        animation:skillGroupIn .28s cubic-bezier(.25,.46,.45,.94) both;
        animation-delay:${groupIdx * 80 + idx * 50 + 60}ms;`;

      // 图标
      const ico = document.createElement('div');
      ico.style.cssText = `width:34px;height:34px;border-radius:10px;background:${ms.light};
        display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;`;
      ico.textContent = sk.icon;

      // 文字
      const info = document.createElement('div');
      info.style.cssText = 'flex:1;min-width:0;';
      const lb = document.createElement('div');
      lb.style.cssText = `font-size:13px;font-weight:700;color:${C.txt};`;
      lb.textContent = sk.label;
      const ds = document.createElement('div');
      ds.style.cssText = `font-size:11px;color:${C.sub};margin-top:2px;`;
      ds.textContent = sk.desc;
      info.appendChild(lb); info.appendChild(ds);

      // 箭头
      const arrow = document.createElement('div');
      arrow.style.cssText = `font-size:15px;color:${ms.tc};flex-shrink:0;transition:transform .15s;`;
      arrow.textContent = '›';

      card2.appendChild(ico); card2.appendChild(info); card2.appendChild(arrow);

      // hover：右移 + 箭头跟进
      card2.onmouseenter = () => {
        card2.style.background = ms.light;
        card2.style.transform = 'translateX(2px)';
        arrow.style.transform = 'translateX(3px)';
      };
      card2.onmouseleave = () => {
        card2.style.background = C.card;
        card2.style.transform = 'translateX(0)';
        arrow.style.transform = 'translateX(0)';
      };

      // 点击：缩放反馈 → 执行技能
      card2.onclick = () => {
        card2.style.transform = 'scale(.97)';
        card2.style.background = ms.light;
        setTimeout(() => { card2.style.transform = ''; }, 150);
        sk.action();
      };

      group.appendChild(card2);
    });

    wrapper.appendChild(group);
  });

  msgsDiv.appendChild(wrapper);
  setTimeout(() => msgsDiv.scrollTo({ top: msgsDiv.scrollHeight, behavior: 'smooth' }), 20);
}

// ── 主函数：Agent 增强版 sendAI（流式输出）───────────────────────────────
async function sendAI(userMsg, aiCtx) {
  const t = (userMsg||state.chatInput).trim();
  if(!t||state.chatLoading) return;
  // 取消上一次未完成的请求
  if (_chatAbortController) { _chatAbortController.abort(); }
  _chatAbortController = new AbortController();
  const signal = _chatAbortController.signal;
  trackAction('chat');
  const newMsgs = [...state.chatMsgs, {role:'user',text:t}];
  setState({chatMsgs:newMsgs, chatInput:'', chatLoading:true});

  const presetReply = localReply(t, newMsgs);

  // 并行：意图识别
  const dispatchPromise = agentDispatch(t, newMsgs, signal);

  try {
    // 先插入一条空的 AI 消息，流式追加内容
    const streamMsgs = [...newMsgs, {role:'ai', text:''}];
    setState({chatMsgs:streamMsgs, chatLoading:true});

    const memoryCtx = buildMemoryContext();

    const chatRes = await fetch(API_URL, {
      method: 'POST', signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({

              '- 成长型思维：能力可以培养，困难是成长机会\n' +
              '- ACT核心理念：接纳不可改变的，承诺行动改善可改变的\n\n' +
              '【核心能力：长期记忆与个性化】\n' +
              '- 你拥有用户的完整记忆档案（见下方"用户记忆档案"），包括基本资料、全部心理测试结果、情绪日记趋势、感恩日记、历史对话摘要、成长成就等。\n' +
              '- 每次对话时，主动回顾这些信息，像老朋友一样自然地提及对方过去分享过的事。例如："上次你提到考试压力大，现在怎么样了？"\n' +
              '- 如果用户的情绪记录显示连续走低，温和地表达关心："我注意到你最近几天的情绪记录都不是太好，想聊聊吗？"\n' +
              '- 如果对方做过某项心理测试，在相关话题中自然引用其结果类型特征。\n' +
              '- 参考历史对话避免重复给出相同的建议，体现"我记得你上次说过…"的连续性。\n' +
              '- 看到感恩日记内容时，可以将其作为积极心理学介入的素材，强化已有的正向关注。\n' +
              '- 个性化但不生硬：不要像读报告一样罗列数据，而是将记忆自然地编织进对话中。\n\n' +
              '底线：不做医疗诊断；若用户提到自我伤害，温柔但明确告知拨打12356或联系学校心理中心。\n\n' +
              '【格式禁令 - 必须严格遵守】\n' +
              '绝对禁止在回复中出现任何括号内的说明、策略注释或内心独白，例如：\n' +
              '禁止："你还好吗（先共情）这件事确实很难（引导深入）"\n' +
              '禁止："（开放式提问）你最近睡眠怎么样？"\n' +
              '禁止：任何 (xxx) 或 （xxx） 形式的括号注解\n' +
              '正确示例："你还好吗？这件事确实很难，发生什么了？"\n' +
              '直接说话，不要暴露任何思考框架或策略标注。' +
              (memoryCtx ? memoryCtx : '') +
              (aiCtx ? '\n\n' + aiCtx : '')
          },
          ...newMsgs.slice(-20)
            .filter(m => m.role !== 'system-notice')
            .map(m => ({
              role: m.role==='ai'?'assistant':'user',
              content: m.text
            }))
        ]
      })
    });

    if (!chatRes.ok) {
      const errText = await chatRes.text().catch(()=>'');
      console.error(`[聆心] API错误 HTTP ${chatRes.status}:`, errText);
      throw new Error(`HTTP_${chatRes.status}`);
    }

    // 流式读取
    const reader = chatRes.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let accumulated = '';
    let buffer = '';

    const cleanReply = (raw) => raw
      .replace(/（[^）]{1,30}）/g, '')
      .replace(/\([^)]{1,30}\)/g, '')
      .replace(/\s{2,}/g, ' ')
      .trim();

    let rafPending = false;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // 保留可能不完整的最后一行

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed === 'data: [DONE]') continue;
        if (!trimmed.startsWith('data: ')) continue;
        try {
          const json = JSON.parse(trimmed.slice(6));
          const delta = json.choices?.[0]?.delta?.content || '';
          if (delta) {
            accumulated += delta;
            if (!rafPending) {
              rafPending = true;
              requestAnimationFrame(() => {
                rafPending = false;
                const liveMsgs = [...newMsgs, {role:'ai', text: cleanReply(accumulated) || accumulated}];
                state.chatMsgs = liveMsgs;
                const msgsDiv = document.querySelector('.chat-msgs');
                if (msgsDiv) {
                  const bubbles = msgsDiv.querySelectorAll('.bubble.ai');
                  const last = bubbles[bubbles.length - 1];
                  if (last) {
                    last.textContent = cleanReply(accumulated) || accumulated;
                    msgsDiv.scrollTo({top: msgsDiv.scrollHeight, behavior:'smooth'});
                  }
                }
              });
            }
          }
        } catch(e) { /* 跳过解析失败的行 */ }
      }
    }

    // 流结束，最终清理并 setState
    const finalReply = cleanReply(accumulated) || presetReply;
    const finalMsgs = [...newMsgs, {role:'ai', text: finalReply}];
    setState({chatMsgs:finalMsgs, chatLoading:false});
    saveCurrentChat(finalMsgs);

    // 渲染技能卡片
    const dispatch = await dispatchPromise;
    if (dispatch && Array.isArray(dispatch.actions) && dispatch.actions.length > 1) {
      setTimeout(() => {
        const msgsDiv = document.querySelector('.chat-msgs');
        if (msgsDiv) {
          const registry = SKILL_REGISTRY;
          const shown = dispatch.actions.filter(a => a !== 'chat' && registry[a] && !_agentShownSkills.has(a));
          appendAgentSkillCards(dispatch.actions, dispatch, msgsDiv);
          agentMemoryRecord(dispatch, registry, shown);
        }
      }, 80);
    }
    if (dispatch?.severity >= 5) {
      console.warn('[聆心 Agent] 危机信号，severity:', dispatch.severity);
    }

  } catch(err) {
    // 请求被取消时静默处理，不显示错误
    if (err.name === 'AbortError') {
      setState({chatLoading:false});
      return;
    }
    console.error('[聆心] 请求失败:', err.message);
    await new Promise(r=>setTimeout(r,400));
    const isNetwork = err instanceof TypeError || err.message === 'Failed to fetch';
    const isHttpErr = err.message.startsWith('HTTP_');
    let errHint = '';
    if (isNetwork) errHint = '（网络连接失败，请检查网络后重试）';
    else if (isHttpErr) errHint = err.message.includes('429') ? '（请求太频繁，请稍后重试）' : '（服务暂时不可用，请稍后重试）';
    const reply = isNetwork || isHttpErr ? presetReply + '\n\n' + errHint : presetReply;
    const finalMsgs = [...newMsgs, {role:'ai', text:reply}];
    setState({chatMsgs:finalMsgs, chatLoading:false});
    saveCurrentChat(finalMsgs);
  }
}

// 自动定期保存当前对话（不新建session，只更新当前）
function saveCurrentChat(msgs) {
  // 只有超过1条用户消息才值得保存
  if(msgs.filter(m=>m.role==='user').length < 1) return;
  // 更新 state.chatHistory 里最新的一条（或追加新的）
  try {
    const hist = state.chatHistory;
    // 检查是否是同一次对话（用第一条用户消息的文本匹配）
    const firstUser = msgs.find(m=>m.role==='user');
    const lastIdx = hist.length-1;
    const isSameSession = lastIdx >= 0 && hist[lastIdx].msgs.find(m=>m.role==='user')?.text === firstUser?.text;
    let newHist;
    if(isSameSession) {
      newHist = [...hist];
      newHist[lastIdx] = {...newHist[lastIdx], msgs};
    } else {
      newHist = [...hist, {
        msgs, id:Date.now(),
        time:new Date().toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})+' '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})
      }].slice(-30);
    }
    localStorage.setItem('lx_chat_history', JSON.stringify(newHist));
    state.chatHistory = newHist;
  } catch(e){}
}

let breathTimers = [];
function startBreathing() {
  breathTimers.forEach(clearTimeout); breathTimers=[];
  let c=0;
  function run() {
    if(c>=4){ trackAction('breathe'); setState({breathPhase:'done'}); return; }
    setState({breathPhase:'inhale',breathCycle:c});
    breathTimers.push(setTimeout(()=>setState({breathPhase:'hold'}),4000));
    breathTimers.push(setTimeout(()=>setState({breathPhase:'exhale'}),11000));
    breathTimers.push(setTimeout(()=>{ c++; run(); },19000));
  }
  setState({breathPhase:'start',breathCycle:0});
  run();
}

function renderDoodle() {
  // ── 核心修复：用局部变量替代 state，切换颜色/工具不触发全局 render，Canvas 内容不丢失 ──
  const local = { tool: 'pen', color: '#B07B3A', size: 6 };

  const wrap = h('div',{style:{padding:'0',background:C.bg,minHeight:'100%'}});
  const body = h('div',{style:{padding:'8px 16px'}});
  body.appendChild(h('p',{style:{color:C.sub,fontSize:'12px',margin:'0 0 10px',textAlign:'center'}},'用画笔表达此刻的情绪，无需技巧，随心涂鸦 🎨'));

  // ── 更新 UI 高亮（不重绘页面）──
  function refreshToolUI() {
    toolRow.querySelectorAll('button').forEach((b,i)=>{
      const tid = i===0?'pen':'eraser';
      b.style.border = `1.5px solid ${local.tool===tid?C.brown:C.border}`;

    });
    sizeRow.querySelectorAll('button').forEach((b,i)=>{
